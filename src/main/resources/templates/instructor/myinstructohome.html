<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강사 마이페이지 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">강사 메뉴</div>
        <a href="/instructor/myinstructor" class="active"><i class="bi bi-house-door"></i> 강사 홈</a>
        <a href="/instructor/profile-register"><i class="bi bi-person-plus"></i> 프로필 등록</a>
        <a href="/instructor/profile-update"><i class="bi bi-pencil"></i> 정보 수정</a>
        <a href="/instructor/course-register"><i class="bi bi-file-earmark-plus"></i> 강의 등록</a>
        <a href="/course-detail"><i class="bi bi-info-circle"></i> 강의 상세</a>
        <a href="/home"><i class="bi bi-arrow-left"></i> 홈으로</a>
    </nav>

    <main class="content-area">
        <div class="welcome-banner">
            <h2 id="welcome-name">환영합니다, 강사님!</h2>
            <p>오늘도 멋진 강의를 만들어주세요.</p>
        </div>

        <div class="card">
            <div class="profile-card">
                <img id="profileImage" src="/images/default-image.jpg" alt="강사" class="profile-avatar">
                <div class="profile-info">
                    <h3>사용자 정보</h3>
                    <p id="nickname"><i class="bi bi-person"></i> 닉네임: -</p>
                    <p id="email"><i class="bi bi-envelope"></i> 이메일: -</p>
                    <p id="phoneNumber"><i class="bi bi-phone"></i> 연락처: -</p>
                    <p id="gender"><i class="bi bi-gender-ambiguous"></i> 성별: -</p>
                    <p id="createdAt"><i class="bi bi-calendar"></i> 가입일: -</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header-custom">강사 정보</div>
            <p id="biography" style="margin-bottom:8px;"><strong>경력:</strong> -</p>
            <p id="introduction" style="margin-bottom:8px;"><strong>소개:</strong> -</p>
            <p id="greeting"><strong>인사말:</strong> -</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalCourses">0</div>
                <div class="stat-label">총 강의 수</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="averageRating">0.0</div>
                <div class="stat-label">평균 평점</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="featuredCourse">-</div>
                <div class="stat-label">대표 강의</div>
            </div>
        </div>

        <div class="chart-card">
            <h4>월별 수강생 수</h4>
            <div class="chart-container">
                <canvas id="studentsChart"></canvas>
            </div>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const userId = document.getElementById('user-id').value;

    function formatPhone(p) {
        return p && p.length === 11 ? p.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3') : (p || '-');
    }

    try {
        const r1 = await fetch('/instructor/getUserInfo?userId=' + userId);
        if (r1.ok) {
            const d = await r1.json();
            document.getElementById('welcome-name').innerText = (d.name || '강사') + ' 강사님, 환영합니다!';
            document.getElementById('nickname').innerHTML = '<i class="bi bi-person"></i> 닉네임: ' + (d.nickname || '-');
            document.getElementById('email').innerHTML = '<i class="bi bi-envelope"></i> 이메일: ' + (d.email || '-');
            document.getElementById('phoneNumber').innerHTML = '<i class="bi bi-phone"></i> 연락처: ' + formatPhone(d.phone_number);
            document.getElementById('gender').innerHTML = '<i class="bi bi-gender-ambiguous"></i> 성별: ' + (d.gender || '-');
            document.getElementById('createdAt').innerHTML = '<i class="bi bi-calendar"></i> 가입일: ' + (d.formattedCreatedAt || '-');
        }

        const r2 = await fetch('/instructor/getUserInfoAll?userId=' + userId);
        if (r2.ok) {
            const d2 = await r2.json();
            document.getElementById('biography').innerHTML = '<strong>경력:</strong> ' + (d2.biography || '-');
            document.getElementById('introduction').innerHTML = '<strong>소개:</strong> ' + (d2.introduction || '-');
            document.getElementById('greeting').innerHTML = '<strong>인사말:</strong> ' + (d2.greeting || '-');
            if (d2.hashing_filename) {
                document.getElementById('profileImage').src = '/Instructorimages/' + d2.hashing_filename;
            }
        }

        const r3 = await fetch('/instructor/review?userId=' + userId);
        if (r3.ok) {
            const d3 = await r3.json();
            document.getElementById('totalCourses').textContent = d3.courseCount || 0;
            document.getElementById('averageRating').textContent = (d3.instructorRating != null ? d3.instructorRating.toFixed(1) : '0.0');
        }

        const ctx = document.getElementById('studentsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['1월','2월','3월','4월','5월','6월'],
                datasets: [{
                    label: '월별 수강생 수',
                    data: [10, 20, 15, 30, 25, 40],
                    backgroundColor: 'rgba(108,99,255,.2)',
                    borderColor: '#6c63ff',
                    borderWidth: 1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });
    } catch (e) { console.error(e); }
});
</script>
</body>
</html>
