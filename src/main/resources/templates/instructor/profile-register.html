<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 등록 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">강사 메뉴</div>
        <a href="/instructor/myinstructor"><i class="bi bi-house-door"></i> 강사 홈</a>
        <a href="/instructor/profile-register" class="active"><i class="bi bi-person-plus"></i> 프로필 등록</a>
        <a href="/instructor/profile-update"><i class="bi bi-pencil"></i> 정보 수정</a>
        <a href="/instructor/course-register"><i class="bi bi-file-earmark-plus"></i> 강의 등록</a>
        <a href="/course-detail"><i class="bi bi-info-circle"></i> 강의 상세</a>
        <a href="/home"><i class="bi bi-arrow-left"></i> 홈으로</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">강사 프로필 등록</h1>
        <p class="page-subtitle">강사의 기본 정보를 입력하세요</p>

        <div class="card" style="max-width: 560px;">
            <form action="/instructor/profile-register" method="post" enctype="multipart/form-data">
                <input type="hidden" id="user-id" name="userId" th:value="${#authentication.principal.id}">

                <div class="form-group">
                    <label class="form-label-custom">강사 이름</label>
                    <input type="text" class="form-input" name="instructor-name" th:value="${#authentication.name}" readonly style="background:#eee;">
                </div>
                <div class="form-group">
                    <label class="form-label-custom">경력</label>
                    <textarea class="form-input" name="biography" rows="3" placeholder="강사의 경력을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">소개</label>
                    <textarea class="form-input" name="introduction" rows="3" placeholder="강사의 소개를 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">인사말</label>
                    <textarea class="form-input" name="greeting" rows="3" placeholder="강사의 인사말을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">프로필 사진</label>
                    <input type="file" class="form-input" name="mfileName" accept="image/*" onchange="previewImg(this)">
                    <img id="preview" src="" alt="" style="width:100px;height:100px;border-radius:50%;object-fit:cover;margin-top:12px;display:none;">
                </div>

                <button type="submit" class="btn-primary-custom" style="margin-top:8px;">프로필 등록</button>
            </form>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
function previewImg(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById('preview');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
</body>
</html>
