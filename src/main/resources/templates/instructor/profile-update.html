<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강사 마이페이지</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* 기본 설정 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* 사이드바 스타일 */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 250px;
        background: linear-gradient(180deg, #4e73df, #1e3d8c); /* 블루 그라디언트 */
        color: #fff;
        padding-top: 20px;
        box-shadow: 2px 0px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    /* 메뉴 항목 스타일 */
    .sidebar a {
        padding: 15px;
        text-decoration: none;
        font-size: 18px;
        color: #fff;
        display: block;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        transition: padding-left 0.3s ease;
    }

    /* 메뉴 항목 호버 효과 */
    .sidebar a:hover {
        background-color: #1e70d2;
        padding-left: 30px;
    }

    /* 콘텐츠 영역 스타일 */
    .content {
        margin-left: 250px;
        padding: 20px;
        background-color: #f8f9fa;
        min-height: 100vh;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05);
    }

    /* 콘텐츠 제목 스타일 */
    .content h2 {
        font-size: 2.5rem;
        font-weight: 700;
        color: #333;
        margin-bottom: 20px;
    }

    /* 콘텐츠 설명 스타일 */
    .content p {
        font-size: 1.2rem;
        color: #555;
    }

    /* 반응형 디자인 */
    @media (max-width: 768px) {
        .sidebar {
            width: 200px;
        }

        .content {
            margin-left: 0;
        }

        .sidebar a {
            font-size: 16px;
        }
    }

    /* 모바일 사이드바 토글 버튼 */
    @media (max-width: 576px) {
        .sidebar {
            position: absolute;
            left: -250px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .sidebar.show {
            left: 0;
        }

        .sidebar a {
            font-size: 14px;
            padding-left: 20px;
        }

        .sidebar-toggle {
            display: block;
            cursor: pointer;
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 30px;
        }
    }
  </style>
</head>
<body>

<!-- 모바일용 사이드바 토글 버튼 -->
<div class="sidebar-toggle d-block d-md-none">
  <i class="bi bi-list"></i>
</div>

<!-- 네비게이션바 (사이드바) -->
<div class="sidebar">
  <a href="/home"><i class="bi bi-house-door"></i> 홈으로 돌아가기</a>
  <a href="/instructor/myinstructor"><i class="bi bi-house-door"></i> 강사 홈페이지</a>
  <a href="/instructor/profile-register"><i class="bi bi-person-plus"></i> 강사 프로필 등록</a>
  <a href="/instructor/profile-update"><i class="bi bi-person-circle"></i> 강사 정보 수정</a>
  <a href="/instructor/course-register"><i class="bi bi-file-earmark-plus"></i> 강의 등록</a>
  <a href="#"><i class="bi bi-pencil-square"></i> 테스트</a>
  <a href="#"><i class="bi bi-upload"></i> 문제 올리기</a>
  <a href="#"><i class="bi bi-chat-dots"></i> Q&A 관리</a>
  <a href="/course-detail"><i class="bi bi-info-circle"></i> 강의 상세보기</a>
</div>


<!-- 콘텐츠 영역 -->
<div class="content">
  <h2>사용자 정보 수정</h2>
  <form id="userInfoForm" enctype="multipart/form-data">
    <!-- 프로필 이미지 표시 -->
    <div class="form-group">
      <label for="profileImageInput">프로필 이미지</label>
      <input type="file" class="form-control-file" id="profileImageInput" name="profileImage">
      <img id="profileImage" src="#" alt="프로필 이미지" class="img-thumbnail mt-3" width="150" style="display: none;">
    </div>

    <div class="form-group">
      <label for="username">아이디</label>
      <input type="text" class="form-control" id="username" name="username" disabled>
    </div>
    <div class="form-group">
      <label for="nickname">닉네임</label>
      <input type="text" class="form-control" id="nickname" name="nickname" required>
    </div>
    <div class="form-group">
      <label for="name">이름</label>
      <input type="text" class="form-control" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="phoneNumber">연락처</label>
      <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" required>
    </div>
    <div class="form-group">
      <label for="email">이메일</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>

    <button type="submit" class="btn btn-primary">수정</button>
  </form>

  <!-- 숨겨진 input 필드를 추가하여 Thymeleaf에서 값을 전달 -->
  <input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const userId = document.getElementById("user-id").value;

    // 사용자 정보 불러오기
    async function loadUserInfo() {
      try {
        const response = await fetch(`/instructor/getUserInfo?userId=${encodeURIComponent(userId)}`, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          },
        });

        if (!response.ok) {
          throw new Error('사용자 정보를 불러오는 데 실패했습니다.');
        }

        const data = await response.json();

        // 사용자 정보 표시
        document.getElementById('username').value = data.username;
        document.getElementById('nickname').value = data.nickname;
        document.getElementById('name').value = data.name;
        document.getElementById('phoneNumber').value = data.phone_number;
        document.getElementById('email').value = data.email;

        // 프로필 이미지 설정
        const profileImage = document.getElementById('profileImage');
        if (data.image_filename) {
          profileImage.src = '/images/' + data.image_filename;
          profileImage.style.display = 'block';  // 이미지 보이기
        }

      } catch (error) {
        alert(error.message);
      }
    }

    loadUserInfo();

    // 이미지 미리보기
    const profileImageInput = document.getElementById('profileImageInput');
    profileImageInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        const image = document.getElementById('profileImage');
        image.src = e.target.result;
        image.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // 사용자 정보 수정 시 제출
    const form = document.getElementById("userInfoForm");
    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const userInfo = {
        username: document.getElementById('username').value,
        nickname: document.getElementById('nickname').value,
        name: document.getElementById('name').value,
        phoneNumber: document.getElementById('phoneNumber').value,
        email: document.getElementById('email').value,
      };

      // 폼 데이터와 프로필 이미지 전송
      const formData = new FormData();
      formData.append("userInfo", JSON.stringify(userInfo));
      const fileInput = document.getElementById('profileImageInput');
      if (fileInput.files[0]) {
        formData.append("profileImage", fileInput.files[0]);
      }

      try {
        const response = await fetch('/instructor/updateUserInfo', {
          method: 'PUT',
          body: formData,
        });

        if (!response.ok) {
          throw new Error('사용자 정보 수정에 실패했습니다.');
        }

        const message = await response.text();
        alert(message);

      } catch (error) {
        alert(error.message);
      }
    });

    // 모바일 사이드바 토글
    const toggleButton = document.querySelector('.sidebar-toggle');
    const sidebar = document.querySelector('.sidebar');

    toggleButton.addEventListener('click', () => {
      sidebar.classList.toggle('show');
    });
  });
</script>

<!-- 부트스트랩 JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.min.js"></script>

</body>
</html>
