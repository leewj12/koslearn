<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 수정 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">강사 메뉴</div>
        <a href="/instructor/myinstructor"><i class="bi bi-house-door"></i> 강사 홈</a>
        <a href="/instructor/profile-register"><i class="bi bi-person-plus"></i> 프로필 등록</a>
        <a href="/instructor/profile-update" class="active"><i class="bi bi-pencil"></i> 정보 수정</a>
        <a href="/instructor/course-register"><i class="bi bi-file-earmark-plus"></i> 강의 등록</a>
        <a href="/course-detail"><i class="bi bi-info-circle"></i> 강의 상세</a>
        <a href="/home"><i class="bi bi-arrow-left"></i> 홈으로</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">사용자 정보 수정</h1>
        <p class="page-subtitle">정보를 수정하세요</p>

        <div class="card" style="max-width: 560px;">
            <form id="userInfoForm" enctype="multipart/form-data">
                <div style="text-align:center; margin-bottom:20px;">
                    <img id="profileImage" src="/images/default-image.jpg" alt="프로필" class="profile-avatar">
                    <div style="margin-top:12px;">
                        <label for="profileImageInput" class="btn-secondary-custom" style="cursor:pointer;">
                            <i class="bi bi-camera"></i> 사진 변경
                        </label>
                        <input type="file" id="profileImageInput" name="profileImage" accept="image/*" style="display:none;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label-custom">아이디</label>
                    <input type="text" class="form-input" id="username" name="username" disabled style="background:#eee;">
                </div>
                <div class="form-group">
                    <label class="form-label-custom">닉네임</label>
                    <input type="text" class="form-input" id="nickname" name="nickname" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">이름</label>
                    <input type="text" class="form-input" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">연락처</label>
                    <input type="text" class="form-input" id="phoneNumber" name="phoneNumber" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">이메일</label>
                    <input type="email" class="form-input" id="email" name="email" required>
                </div>

                <button type="submit" class="btn-primary-custom" style="margin-top:8px;">수정하기</button>
            </form>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

<script>
document.addEventListener("DOMContentLoaded", () => {
    const userId = document.getElementById("user-id").value;

    async function loadUserInfo() {
        try {
            const r = await fetch('/instructor/getUserInfo?userId=' + encodeURIComponent(userId));
            if (!r.ok) throw new Error('불러오기 실패');
            const d = await r.json();
            document.getElementById('username').value = d.username || '';
            document.getElementById('nickname').value = d.nickname || '';
            document.getElementById('name').value = d.name || '';
            document.getElementById('phoneNumber').value = d.phone_number || '';
            document.getElementById('email').value = d.email || '';
            if (d.image_filename) {
                document.getElementById('profileImage').src = '/images/' + d.image_filename;
            }
        } catch (e) { console.error(e); }
    }
    loadUserInfo();

    document.getElementById('profileImageInput').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('profileImage').src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById("userInfoForm").addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData();
        formData.append("userInfo", JSON.stringify({
            username: document.getElementById('username').value,
            nickname: document.getElementById('nickname').value,
            name: document.getElementById('name').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            email: document.getElementById('email').value,
        }));
        const f = document.getElementById('profileImageInput');
        if (f.files[0]) formData.append("profileImage", f.files[0]);
        try {
            const r = await fetch('/instructor/updateUserInfo', { method: 'PUT', body: formData });
            alert(r.ok ? await r.text() : '수정 실패');
        } catch (err) { alert(err.message); }
    });
});
</script>
</body>
</html>
