<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 목록 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .table-custom td, .table-custom th { text-align:center; white-space:nowrap; }
        .table-custom td { overflow:hidden; text-overflow:ellipsis; max-width:180px; }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">강사 메뉴</div>
        <a href="/instructor/myinstructor"><i class="bi bi-house-door"></i> 강사 홈</a>
        <a href="/instructor/profile-register"><i class="bi bi-person-plus"></i> 프로필 등록</a>
        <a href="/instructor/profile-update"><i class="bi bi-person-circle"></i> 정보 수정</a>
        <a href="/instructor/course-register"><i class="bi bi-file-earmark-plus"></i> 강의 등록</a>
        <a href="/course-detail" class="active"><i class="bi bi-info-circle"></i> 강의 목록</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">강의 목록</h1>
        <p class="page-subtitle">등록된 강의를 관리하세요</p>

        <input type="hidden" id="user-id" th:value="${#authentication.principal.id}">
        <input type="hidden" id="user-role" th:value="${#authentication.principal.authorities[0].authority}">

        <div class="card">
            <div style="overflow-x:auto;">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>제목</th>
                        <th>설명</th>
                        <th>간단 설명</th>
                        <th>난이도</th>
                        <th>등록일</th>
                        <th>가격</th>
                        <th>수정</th>
                        <th th:if="${#authentication.principal.authorities[0].authority == 'ROLE_ADMIN'}">삭제</th>
                    </tr>
                    </thead>
                    <tbody id="course-list"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const userId = document.getElementById("user-id").value;
    const userRole = document.getElementById("user-role").value;
    try {
        const response = await fetch(`/instructor/courselist?userId=${encodeURIComponent(userId)}`, {
            method: 'GET', headers: { 'Accept': 'application/json' }
        });
        const data = await response.json();
        const courseListElement = document.getElementById("course-list");

        data.forEach(course => {
            const row = document.createElement("tr");
            let price = parseInt(course.price);
            if (isNaN(price)) price = 0;
            const formattedPrice = price.toLocaleString();

            row.innerHTML = `
                <td>${course.courseId}</td>
                <td>${course.title}</td>
                <td>${course.description}</td>
                <td>${course.summary}</td>
                <td>${course.level}</td>
                <td>${course.createdAtFormatted}</td>
                <td>${formattedPrice}원</td>
                <td><a href="/course/edit/${course.courseId}" class="btn-primary-custom" style="padding:4px 12px; font-size:12px;"><i class="bi bi-pencil"></i> 수정</a></td>
                <td ${userRole !== 'ROLE_ADMIN' ? 'style="display:none;"' : ''}>
                    <form action="/course/delete/${course.courseId}" method="POST" onsubmit="return confirm('정말로 이 강의를 삭제하시겠습니까?');">
                        <button type="submit" class="btn-danger-custom" style="padding:4px 12px; font-size:12px;"><i class="bi bi-trash"></i> 삭제</button>
                    </form>
                </td>`;
            courseListElement.appendChild(row);
        });
    } catch (error) { alert('에러 발생: ' + error.message); }
});
</script>
</body>
</html>
