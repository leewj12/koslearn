<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강사 마이페이지 - 강의 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/templates/instructor/style.css" rel="stylesheet">
  <style>
    /* 기본 설정 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* 사이드바 스타일 */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 250px;
        background: linear-gradient(180deg, #4e73df, #1e3d8c); /* 블루 그라디언트 */
        color: #fff;
        padding-top: 20px;
        box-shadow: 2px 0px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    /* 메뉴 항목 스타일 */
    .sidebar a {
        padding: 15px;
        text-decoration: none;
        font-size: 18px;
        color: #fff;
        display: block;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        transition: padding-left 0.3s ease;
    }

    /* 메뉴 항목 호버 효과 */
    .sidebar a:hover {
        background-color: #1e70d2;
        padding-left: 30px;
    }

    /* 콘텐츠 영역 스타일 */
    .content {
        margin-left: 260px;
        padding: 20px;
        background-color: #f8f9fa;
        min-height: 100vh;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05);
    }

    /* 콘텐츠 제목 스타일 */
    .content h2 {
        font-size: 2.5rem;
        font-weight: 700;
        color: #333;
        margin-bottom: 20px;
    }

    /* 강의 등록 폼 스타일 */
    .form-group {
        margin-bottom: 15px;
    }

    .form-control {
        border-radius: 10px;
        width: 100%;
    }

    /* 길이 조절: input, textarea의 폭을 적절하게 조정 */
    .form-control {
        max-width: 500px;  /* 최대폭을 500px로 설정 */
        width: 100%;
    }

    textarea {
        max-width: 500px;
        width: 100%;
    }

    /* 반응형 디자인 */
    @media (max-width: 768px) {
        .sidebar {
            width: 200px;
        }

        .content {
            margin-left: 0;
        }

        .sidebar a {
            font-size: 16px;
        }
    }

    /* 모바일 사이드바 토글 버튼 */
    @media (max-width: 576px) {
        .sidebar {
            position: absolute;
            left: -250px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .sidebar.show {
            left: 0;
        }

        .sidebar a {
            font-size: 14px;
            padding-left: 20px;
        }

        .sidebar-toggle {
            display: block;
            cursor: pointer;
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 30px;
        }
    }

    /* 입력 필드 간격과 버튼 스타일 개선 */
    .form-group {
        margin-bottom: 20px;
    }

    /* 추가된 강의 URL과 파일 업로드 폼 스타일 */
    .form-group input[type="file"] {
        padding: 5px;
    }

    /* 버튼 스타일 */
    .btn-custom {
        background-color: #4e73df;
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
    }

    .btn-custom:hover {
        background-color: #365eab;
    }


/* 기존 테이블 스타일 */
.table th, .table td {
    text-align: center;
    vertical-align: middle;
    overflow: hidden;  /* 넘치는 글씨 숨기기 */
    text-overflow: ellipsis;  /* 글자가 넘칠 경우 '...'으로 표시 */
    white-space: nowrap;  /* 텍스트가 줄 바꿈되지 않도록 설정 */
}

/* 긴 텍스트가 넘치는 셀에 적용될 스타일 */
.table td {
    max-width: 200px;  /* 셀 너비 제한 (필요에 따라 값 조정 가능) */
}



  </style>
</head>
<body>

<!-- 네비게이션바 (사이드바) -->
<div class="sidebar">
  <a href="/home"><i class="bi bi-house-door"></i> 홈으로 돌아가기</a>
  <a href="/instructor/myinstructor"><i class="bi bi-house-door"></i> 강사 홈페이지</a>
  <a href="/instructor/profile-register"><i class="bi bi-person-plus"></i> 강사 프로필 등록</a>
  <a href="/instructor/profile-update"><i class="bi bi-person-circle"></i> 강사 정보 수정</a>
  <a href="/instructor/course-register"><i class="bi bi-file-earmark-plus"></i> 강의 등록</a>
  <a href="#"><i class="bi bi-pencil-square"></i> 테스트</a>
  <a href="#"><i class="bi bi-upload"></i> 문제 올리기</a>
  <a href="#"><i class="bi bi-chat-dots"></i> Q&A 관리</a>
  <a href="/course-detail"><i class="bi bi-info-circle"></i> 강의 상세보기</a>
</div>

<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">
<input type="hidden" id="user-role" th:value="${#authentication.principal.authorities[0].authority}"> <!-- 사용자 역할 추가 -->

<!-- 강의 등록 콘텐츠 (중앙) -->
<div class="content">
  <h2>코스런 강의 목록</h2>

  <!-- 강의 목록 테이블 -->
  <table class="table table-striped">
    <thead>
    <tr>
      <th>강의 ID <i class="bi bi-card-list"></i></th> <!-- 강의 ID 아이콘 -->
      <th>강의 제목 <i class="bi bi-pencil-square"></i></th> <!-- 강의 제목 아이콘 -->
      <th>강의 설명 <i class="bi bi-file-earmark-text"></i></th> <!-- 강의 설명 아이콘 -->
      <th>강의 간단 설명 <i class="bi bi-chat-left-dots"></i></th> <!-- 간단 설명 아이콘 -->
      <th>강의 난이도 <i class="bi bi-bar-chart"></i></th> <!-- 난이도 아이콘 -->
      <th>등록일 <i class="bi bi-calendar-date"></i></th> <!-- 등록일 아이콘 -->
      <th>가격 <i class="bi bi-currency-dollar"></i></th> <!-- 가격 아이콘 -->
      <th>수정 <i class="bi bi-pencil-square"></i></th> <!-- 수정 아이콘 -->
      <th th:if="${#authentication.principal.authorities[0].authority == 'ROLE_ADMIN'}">
        삭제 <i class="bi bi-trash"></i> <!-- 삭제 아이콘 -->
      </th> <!-- 관리자만 볼 수 있도록 조건 추가 -->
    </tr>
    </thead>
    <tbody id="course-list">
    <!-- JavaScript로 동적으로 채워짐 -->
    </tbody>
  </table>
</div>

<!-- 부트스트랩 JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.min.js"></script>

<script>
  $(document).ready(function() {
    // 사이드바 토글 버튼 (모바일용)
    $(".sidebar-toggle").click(function() {
        $(".sidebar").toggleClass("show");
    });
  });

  // 강의 목록을 테이블에 동적으로 표시
document.addEventListener("DOMContentLoaded", async () => {
  const userId = document.getElementById("user-id").value;
  const userRole = document.getElementById("user-role").value; // 역할 정보 가져오기

  try {
    const response = await fetch(`/instructor/courselist?userId=${encodeURIComponent(userId)}`, {
      method: 'GET',
      headers: {
        'Accept': 'application/json',
      },
    });

    const data = await response.json();
    const courseListElement = document.getElementById("course-list");

    // 강의 목록 데이터를 테이블에 삽입
    data.forEach(course => {
      const row = document.createElement("tr");

      // 가격을 숫자로 변환한 후 천 단위 구분 기호 추가
      let price = parseInt(course.price); // 가격을 숫자로 변환
      if (isNaN(price)) {
        price = 0; // 만약 숫자가 아니라면 0으로 처리
      }
      const formattedPrice = price.toLocaleString(); // 천 단위 구분 기호 추가

      // 테이블 내용 삽입
      row.innerHTML = `
        <td>${course.courseId}</td>
        <td>${course.title}</td>
        <td>${course.description}</td>
        <td>${course.summary}</td>
        <td>${course.level}</td>
        <td>${course.createdAtFormatted}</td>
        <td>${formattedPrice} 원</td> <!-- 천 단위 구분 기호 추가 -->
        <td><a href="/course/edit/${course.courseId}" class="btn btn-primary">수정</a></td>

        <!-- 관리자만 삭제 버튼이 보이도록 조건 추가 -->
        <td ${userRole !== 'ROLE_ADMIN' ? 'style="display:none;"' : ''}>
          <!-- 삭제를 위한 폼 -->
          <form action="/course/delete/${course.courseId}" method="POST" onsubmit="return confirm('정말로 이 강의를 삭제하시겠습니까?');">
            <button type="submit" class="btn btn-danger">삭제</button>
          </form>
        </td>
      `;

      courseListElement.appendChild(row);
    });

  } catch (error) {
    alert('에러 발생: ' + error.message);
  }
});


</script>

</body>
</html>
