<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 등록 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">강사 메뉴</div>
        <a href="/instructor/myinstructor"><i class="bi bi-house-door"></i> 강사 홈</a>
        <a href="/instructor/profile-register"><i class="bi bi-person-plus"></i> 프로필 등록</a>
        <a href="/instructor/profile-update"><i class="bi bi-pencil"></i> 정보 수정</a>
        <a href="/instructor/course-register" class="active"><i class="bi bi-file-earmark-plus"></i> 강의 등록</a>
        <a href="/course-detail"><i class="bi bi-info-circle"></i> 강의 상세</a>
        <a href="/home"><i class="bi bi-arrow-left"></i> 홈으로</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">강의 등록</h1>
        <p class="page-subtitle">새로운 강의를 등록하세요</p>

        <div class="card" style="max-width: 640px;">
            <form action="/instructor/course-register" method="post" enctype="multipart/form-data">
                <input type="hidden" id="instructor-id" name="instructorId" value="">
                <input type="hidden" id="user-id" name="userId" th:value="${#authentication.principal.id}">

                <div class="form-group">
                    <label class="form-label-custom">강의 제목</label>
                    <input type="text" class="form-input" name="title" placeholder="강의 제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">강의 설명</label>
                    <textarea class="form-input" name="description" rows="4" placeholder="강의에 대한 설명을 입력하세요" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">강의 간단 설명</label>
                    <textarea class="form-input" name="summary" rows="3" placeholder="강의의 간단한 설명을 입력하세요" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">강의 가격</label>
                    <input type="number" class="form-input" name="price" placeholder="강의 가격을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">강의 URL</label>
                    <input type="url" class="form-input" name="url" placeholder="강의 URL을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">썸네일 URL</label>
                    <input type="url" class="form-input" name="thumbnailUrl" placeholder="썸네일 URL을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">강의 자료 (파일 업로드)</label>
                    <input type="file" class="form-input" name="courseMaterials" multiple>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">카테고리</label>
                    <select class="form-input" name="category" required>
                        <option value="">카테고리 선택</option>
                        <option value="programming">프로그래밍</option>
                        <option value="design">디자인</option>
                        <option value="marketing">마케팅</option>
                        <option value="data-science">데이터 사이언스</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">강의 이미지</label>
                    <input type="file" class="form-input" name="courseImage">
                </div>
                <div class="form-group">
                    <label class="form-label-custom">난이도</label>
                    <select class="form-input" name="level" required>
                        <option value="초급">초급</option>
                        <option value="중급">중급</option>
                        <option value="고급">고급</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary-custom" style="margin-top:8px;">강의 등록</button>
            </form>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const userId = document.getElementById("user-id").value;
    try {
        const r = await fetch('/instructor/getInstructorId?userId=' + encodeURIComponent(userId));
        const d = await r.json();
        document.getElementById("instructor-id").value = d.instructor_Id;
    } catch (e) {
        alert('먼저 강사프로필 등록을 해주셔야합니다!');
    }
});
</script>
</body>
</html>
