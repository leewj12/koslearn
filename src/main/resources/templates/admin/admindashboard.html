<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Bootstrap CSS (사용자 편의상 외부 CDN 링크로 추가) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"> <!-- 부트스트랩 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"> <!-- Poppins 폰트 추가 -->

    <style>
        /* 기본적인 스타일 설정 */
        body {
            font-family: 'Poppins', sans-serif; /* Poppins 폰트 적용 */
            margin: 0;
            padding: 0;
            background-color: #f9fafb; /* 부드러운 회색-하늘색 배경 */
        }

        /* 사이드바 스타일 */
        .sidebar {
            background-color: #343a40; /* 어두운 회색 */
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 30px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar a {
            color: #fff;
            font-size: 16px;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #007bff; /* 파란색 */
        }

        .content {
            margin-left: 270px;
            padding: 30px;
        }

        /* 대시보드 타이틀 스타일 */
        .dashboard-header {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
        }

        /* 대시보드 제목 이모티콘 추가 */
        .dashboard-header i {
            font-size: 40px;
            margin-right: 15px;
            color: #007bff;
            color: #56ab2f; /* 아이콘도 연두색으로 변경 */
        }

        /* 관리 버튼 스타일 */
        .dashboard-button {
            background: linear-gradient(to right, #a8e063, #56ab2f);

            color: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dashboard-button:hover {
            background-color: #0056b3; /* 클릭시 어두운 파란색 */
            transform: translateY(-5px);
        }

        .dashboard-button i {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .dashboard-button div {
            font-weight: bold;
            font-size: 18px;
        }

        /* 로그인 후 사용자 정보 스타일 */
        .welcome-message {
            font-size: 16px;
            color: #555;
            margin-top: 20px;
        }

        /* 작은 화면에서 사이드바 숨기기 */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .content {
                margin-left: 0;
            }
        }

        /* 카드 스타일 */
        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
            background-color: #fff;
        }

        .card:hover {
            box-shadow: 0px 6px 10px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            font-weight: bold;
            font-size: 18px;
            background-color: #f9fafb;
        }

        .card-body {
            font-size: 14px;
            color: #555;
        }

        .card-footer {
            text-align: right;
        }

        /* 새로운 대시보드 판 스타일 */
        .additional-dashboard {
            background-color: #f9f9f9;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .additional-dashboard h3 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        .additional-dashboard p {
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

<!-- Sidebar 메뉴 -->
<div class="sidebar">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a href="/home"><i class="bi bi-house-door"></i> 홈</a>
        </li>

        <li class="nav-item">
            <a href="/admin/home"><i class="bi bi-house-door"></i> 관리자 페이지</a>
        </li>


        <li class="nav-item">
            <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        </li>
        <li class="nav-item">
            <a href="/course/view"><i class="bi bi-play-circle"></i> 강의보기</a>
        </li>
        <li class="nav-item">
            <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        </li>
        <li class="nav-item">
            <a href="/signup" sec:authorize="!isAuthenticated()"><i class="bi bi-person-plus"></i> 회원가입</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_STUDENT') or hasRole('ROLE_ADMIN')">
            <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_STUDENT') or hasRole('ROLE_ADMIN')">
            <a href="/cart/purchase"><i class="bi bi-cart"></i> 장바구니</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_INSTRUCTOR') or hasRole('ROLE_ADMIN')">
            <a href="/instructor/myinstructor"><i class="bi bi-person-bounding-box"></i> 강사 마이페이지</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성하기</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a href="/admin/users"><i class="bi bi-person-check"></i> 회원 관리</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a href="/logout"><i class="bi bi-box-arrow-right"></i> 로그아웃</a>
        </li>

        <!-- 로그인한 사용자의 아이디와 환영 메시지 -->
        <li sec:authorize="isAuthenticated()">
            <span class="welcome-message" style="color: #ffffff;">환영합니다, <span th:text="${#authentication.name}"></span>님! <i class="bi bi-person-check"></i></span>
        </li>
    </ul>
</div>

<!-- 메인 콘텐츠 -->
<div class="content">
    <div class="dashboard-header">
        <i class="bi bi-journal-bookmark"></i> 코스런 관리자 페이지
    </div>

    <!-- 대시보드 버튼들 -->
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/admin/notice'">
                <i class="bi bi-pencil-square"></i>
                <div>공지사항 관리</div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/admin/users'">
                <i class="bi bi-person-check"></i>
                <div>회원 관리</div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/instructor/myinstructor'">
                <i class="bi bi-person-bounding-box"></i>
                <div>강사 관리</div>
            </div>
        </div>
    </div>

    <!-- 두 번째 행 (커뮤니티 관리, 결제 관리, 강의 관리) -->
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/community/list'">
                <i class="bi bi-chat-left-text"></i>
                <div>커뮤니티 관리</div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/admin/payment'">
                <i class="bi bi-credit-card"></i>
                <div>결제 관리</div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/admin/courselist'">
                <i class="bi bi-play-circle"></i>
                <div>강의 관리</div>
            </div>
        </div>
    </div>

    <!-- 세 번째 행 (마이페이지, 장바구니, 전체 관리) -->
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/my/mypage'">
                <i class="bi bi-person-circle"></i>
                <div>마이페이지</div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/cart/purchase'">
                <i class="bi bi-cart"></i>
                <div>장바구니</div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="dashboard-button" onclick="window.location.href='/admin/management'">
                <i class="bi bi-tools"></i>
                <div>전체 관리</div>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS (외부 CDN 링크) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
