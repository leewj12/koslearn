<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">관리자 메뉴</div>
        <a href="/admin/home" class="active"><i class="bi bi-speedometer2"></i> 대시보드</a>
        <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성</a>
        <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        <a href="/admin/courselist"><i class="bi bi-play-circle"></i> 강의 관리</a>
        <a href="/admin/payment"><i class="bi bi-credit-card"></i> 결제 관리</a>
        <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
    </nav>

    <main class="content-area">
        <div class="welcome-banner">
            <h2>관리자 대시보드</h2>
            <p>코스런 서비스를 관리하세요. 환영합니다, <span th:text="${#authentication.name}"></span>님!</p>
        </div>

        <div class="dash-grid">
            <a href="/admin/notice" class="dash-btn">
                <i class="bi bi-pencil-square"></i> 공지사항 관리
            </a>
            <a href="/admin/courselist" class="dash-btn">
                <i class="bi bi-play-circle"></i> 강의 관리
            </a>
            <a href="/admin/payment" class="dash-btn">
                <i class="bi bi-credit-card"></i> 결제 관리
            </a>
            <a href="/community/list" class="dash-btn">
                <i class="bi bi-chat-left-text"></i> 커뮤니티 관리
            </a>
            <a href="/instructor/myinstructor" class="dash-btn">
                <i class="bi bi-person-bounding-box"></i> 강사 관리
            </a>
            <a href="/my/mypage" class="dash-btn">
                <i class="bi bi-person-circle"></i> 마이페이지
            </a>
            <a href="/cart/purchase" class="dash-btn">
                <i class="bi bi-cart"></i> 장바구니
            </a>
            <a href="/course/view" class="dash-btn">
                <i class="bi bi-book"></i> 강의 보기
            </a>
            <a href="/home" class="dash-btn">
                <i class="bi bi-house-door"></i> 홈으로
            </a>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

</body>
</html>
