<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 관리 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>.table-wrap { overflow-x: auto; }</style>
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">관리자 메뉴</div>
        <a href="/admin/home"><i class="bi bi-speedometer2"></i> 대시보드</a>
        <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성</a>
        <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        <a href="/admin/courselist"><i class="bi bi-play-circle"></i> 강의 관리</a>
        <a href="/admin/payment" class="active"><i class="bi bi-credit-card"></i> 결제 관리</a>
        <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">결제 관리</h1>
        <p class="page-subtitle">강의 결제 내역을 관리하세요</p>

        <div class="card">
            <div class="table-wrap">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th>결제 ID</th>
                        <th>사용자</th>
                        <th>강의명</th>
                        <th>금액</th>
                        <th>결제일</th>
                        <th>결제 방법</th>
                        <th>상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="payment : ${adminPaymentList}">
                        <td th:text="${payment.payment_id != null ? payment.payment_id : '-'}"></td>
                        <td th:text="${payment.username != null ? payment.username : '-'}"></td>
                        <td th:text="${payment.title != null ? payment.title : '-'}"></td>
                        <td th:text="${payment.amount != null ? payment.amount : '-'}"></td>
                        <td th:text="${payment.getCreatedAtFormatted() != null ? payment.getCreatedAtFormatted() : '-'}"></td>
                        <td th:text="${payment.payment_Method != null ? payment.payment_Method : '-'}"></td>
                        <td>
                            <span class="badge-custom badge-green" th:if="${payment.payment_Status == '완료'}" th:text="${payment.payment_Status}"></span>
                            <span class="badge-custom badge-red" th:if="${payment.payment_Status != '완료'}" th:text="${payment.payment_Status != null ? payment.payment_Status : '-'}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(adminPaymentList)}" class="empty-state">
                <i class="bi bi-receipt-cutoff"></i>
                <p>결제 내역이 없습니다.</p>
            </div>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

</body>
</html>
