<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Bootstrap CSS (사용자 편의상 외부 CDN 링크로 추가) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"> <!-- 부트스트랩 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"> <!-- Poppins 폰트 추가 -->

    <style>
        /* 기존 스타일 */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
        }

        .sidebar {
            background-color: #343a40;
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 30px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar a {
            color: #fff;
            font-size: 16px;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #007bff;
        }

        .content {
            margin-left: 270px;
            padding: 30px;
        }

        .dashboard-header {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
            display: flex;
            align-items: center;
        }

        /* 테이블 스타일 */
        .table {
            border-collapse: collapse; /* 테이블 셀 간의 경계선 겹침 방지 */
            width: 100%;
        }

        .table th, .table td {
            vertical-align: middle;
            text-align: center;
            padding: 12px;
            border: 1px solid #ddd; /* 셀 테두리 추가 */
        }

        .table th {
            background-color: #007bff;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .table tbody tr:nth-child(odd) {
            background-color: #f8f9fa; /* 홀수 행 배경색 */
        }

        .table tbody tr:nth-child(even) {
            background-color: #e9ecef; /* 짝수 행 배경색 */
        }

        .table tbody tr:hover {
            background-color: #f1f5f9; /* 호버 시 배경색 */
        }

        .table .btn {
            font-size: 14px;
        }

        /* 추가된 테이블 스타일 */
        .table td {
            font-size: 14px;
            color: #495057;
        }

        .table tbody td {
            font-size: 15px;
        }
    </style>
</head>
<body>

<!-- Sidebar 메뉴 -->
<div class="sidebar">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a href="/home"><i class="bi bi-house-door"></i> 홈</a>
        </li>
        <li class="nav-item">
            <a href="/admin/home"><i class="bi bi-house-door"></i> 관리자 페이지</a>
        </li>
        <li class="nav-item">
            <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        </li>
        <li class="nav-item">
            <a href="/course/view"><i class="bi bi-play-circle"></i> 강의보기</a>
        </li>
        <li class="nav-item">
            <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        </li>
        <li class="nav-item">
            <a href="/signup" sec:authorize="!isAuthenticated()"><i class="bi bi-person-plus"></i> 회원가입</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_STUDENT') or hasRole('ROLE_ADMIN')">
            <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_STUDENT') or hasRole('ROLE_ADMIN')">
            <a href="/cart/purchase"><i class="bi bi-cart"></i> 장바구니</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_INSTRUCTOR') or hasRole('ROLE_ADMIN')">
            <a href="/instructor/myinstructor"><i class="bi bi-person-bounding-box"></i> 강사 마이페이지</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성하기</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a href="/admin/users"><i class="bi bi-person-check"></i> 회원 관리</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a href="/logout"><i class="bi bi-box-arrow-right"></i> 로그아웃</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <span class="welcome-message" style="color: #ffffff;">환영합니다, <span th:text="${#authentication.name}"></span>님! <i class="bi bi-person-check"></i></span>
        </li>
    </ul>
</div>

<!-- 메인 콘텐츠 -->
<div class="content">
    <div class="dashboard-header">
        <i class="bi bi-currency-dollar"></i> 코스런 강의 결제내역
    </div>

    <!-- 결제 내역 테이블 -->
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>결제 ID</th>
                <th>사용자 이름</th>
                <th>강의 이름</th>
                <th>결제 금액</th>
                <th>결제 일시</th>
                <th>결제 방법</th>
                <th>결제 상태</th>
            </tr>
            </thead>
            <tbody>
            <!-- Thymeleaf를 사용하여 결제 내역 리스트 출력 -->
            <tr th:each="payment : ${adminPaymentList}">
                <td th:text="${payment.payment_id != null ? payment.payment_id : '정보없음'}"></td>
                <td th:text="${payment.username != null ? payment.username : '정보없음'}"></td>
                <td th:text="${payment.title != null ? payment.title : '정보없음'}"></td>
                <td th:text="${payment.amount != null ? payment.amount : '정보없음'}"></td>
                <td th:text="${payment.getCreatedAtFormatted() != null ? payment.getCreatedAtFormatted() : '정보없음'}"></td>
                <td th:text="${payment.payment_Method != null ? payment.payment_Method : '정보없음'}"></td>
                <td th:text="${payment.payment_Status != null ? payment.payment_Status : '정보없음'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
