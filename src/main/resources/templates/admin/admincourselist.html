<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 관리 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">관리자 메뉴</div>
        <a href="/admin/home"><i class="bi bi-speedometer2"></i> 대시보드</a>
        <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성</a>
        <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        <a href="/admin/courselist" class="active"><i class="bi bi-play-circle"></i> 강의 관리</a>
        <a href="/admin/payment"><i class="bi bi-credit-card"></i> 결제 관리</a>
        <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">강의 관리</h1>
        <p class="page-subtitle">등록된 강의 목록을 관리하세요</p>

        <div class="card">
            <div class="table-wrap">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>강의 제목</th>
                        <th>설명</th>
                        <th>난이도</th>
                        <th>등록일</th>
                        <th>가격</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="course : ${courselist}">
                        <td th:text="${course.courseId}"></td>
                        <td th:text="${course.title}"></td>
                        <td th:text="${course.summary}" style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></td>
                        <td><span class="badge-custom badge-purple" th:text="${course.level}"></span></td>
                        <td th:text="${course.getCreatedAtFormatted()}"></td>
                        <td class="course-price" th:text="${course.price}"></td>
                        <td style="white-space:nowrap;">
                            <a th:href="@{/admin/course/detail/{id}(id=${course.courseId})}" class="btn-secondary-custom" style="padding:6px 12px; font-size:12px;">상세</a>
                            <a th:href="@{/course/edit/{id}(id=${course.courseId})}" class="btn-primary-custom" style="padding:6px 12px; font-size:12px;">수정</a>
                            <form th:action="@{/admin/course/delete/{id}(id=${course.courseId})}" method="post" style="display:inline;" onsubmit="return confirm('정말로 삭제하시겠습니까?');">
                                <button type="submit" class="btn-danger-custom" style="padding:6px 12px; font-size:12px;">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(courselist)}" class="empty-state">
                <i class="bi bi-inbox"></i>
                <p>등록된 강의가 없습니다.</p>
            </div>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('.course-price').forEach(function(el) {
        var n = parseInt(el.innerText.replace(/,/g, ''));
        if (!isNaN(n)) el.innerText = n.toLocaleString() + '원';
    });
});
</script>
</body>
</html>
