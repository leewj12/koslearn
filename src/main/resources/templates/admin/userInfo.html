<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 상세 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .info-item { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f0f0f0; font-size:14px; }
        .info-item .label { font-weight:600; color:#555; }
        .info-item .value { color:#333; }
        @media (max-width:768px) { .info-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div style="max-width:800px; margin:0 auto; padding:32px 20px;">
    <a href="/admin/users" class="btn-secondary-custom" style="margin-bottom:20px; display:inline-block;"><i class="bi bi-arrow-left"></i> 목록</a>

    <h1 class="page-title">회원 상세 정보</h1>
    <p class="page-subtitle">회원의 상세 정보를 확인합니다</p>

    <div id="member-info">
        <div class="card" style="text-align:center; padding:40px;">
            <p style="color:#888;">로딩 중...</p>
        </div>
    </div>
</div>

<script>
async function fetchMemberInfo() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get("id");
    if (!id) {
        document.getElementById("member-info").innerHTML = '<div class="card empty-state"><p>유효한 회원 ID가 제공되지 않았습니다.</p></div>';
        return;
    }
    try {
        const response = await fetch(`/admin/api/users/info?id=${id}`);
        if (!response.ok) throw new Error(response.statusText);
        const data = await response.json();
        document.getElementById("member-info").innerHTML = `
            <div class="card">
                <div class="card-header-custom"><i class="bi bi-person"></i> 기본 정보</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">ID</span><span class="value">${data.id}</span></div>
                    <div class="info-item"><span class="label">아이디</span><span class="value">${data.username}</span></div>
                    <div class="info-item"><span class="label">이름</span><span class="value">${data.name}</span></div>
                    <div class="info-item"><span class="label">별명</span><span class="value">${data.nickname}</span></div>
                    <div class="info-item"><span class="label">이메일</span><span class="value">${data.email}</span></div>
                    <div class="info-item"><span class="label">전화번호</span><span class="value">${data.phoneNumber}</span></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header-custom"><i class="bi bi-gear"></i> 기타 정보</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">성별</span><span class="value">${data.gender}</span></div>
                    <div class="info-item"><span class="label">등급</span><span class="value"><span class="badge-custom badge-purple">${data.role}</span></span></div>
                    <div class="info-item"><span class="label">정보 동의</span><span class="value">${data.termsAgreement ? '동의' : '비동의'}</span></div>
                    <div class="info-item"><span class="label">마케팅 동의</span><span class="value">${data.marketingAgreement ? '동의' : '비동의'}</span></div>
                    <div class="info-item"><span class="label">가입일</span><span class="value">${new Date(data.createdAt).toLocaleString()}</span></div>
                    <div class="info-item"><span class="label">수정일</span><span class="value">${new Date(data.updatedAt).toLocaleString()}</span></div>
                </div>
            </div>`;
    } catch (error) {
        document.getElementById("member-info").innerHTML = '<div class="card empty-state"><i class="bi bi-exclamation-triangle"></i><p>회원 정보를 불러오는 데 실패했습니다.</p></div>';
    }
}
document.addEventListener("DOMContentLoaded", fetchMemberInfo);
</script>
</body>
</html>
