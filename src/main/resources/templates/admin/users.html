<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>유저 관리 페이지</title>
    <!-- Bootstrap CSS 추가 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"> <!-- 이미지 아이콘 부트스트랩 -->
    <link rel="stylesheet" th:href="@{/css/header/header.css}">

    <style>
        /* 공통 스타일 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 100px; /* 상단바와 간격 조정 */
            padding: 20px;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }

        /* 테이블 스타일 */
        .table-container {
            margin: 0 auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            max-width: 100%; /* 화면 너비에 맞게 */
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px; /* 패딩 조정 */
            text-align: center;
        }

        th {
            background-color: #f39c12;
            color: #ffffff;
            text-transform: uppercase;
            border-bottom: 2px solid #e67e22;
        }

        td {
            background-color: #f9f9f9;
            color: #555;
            border-bottom: 1px solid #ddd;
        }

        tr:hover td {
            background-color: #ffe5b4;
        }

        /* 버튼 스타일 */
        .btn {
            font-weight: bold;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* 페이지네이션 스타일 */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding: 10px 0;
        }

        .pagination .page-item {
            margin: 0 5px;
        }

        .pagination .page-link {
            color: #3498db;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 8px 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .pagination .page-link:hover {
            background-color: #3498db;
            color: white;
        }

        .pagination .active .page-link {
            background-color: #2980b9;
            color: white;
            border-color: #2980b9;
        }

        /* 검색 폼 스타일 */
        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }

        .search-container form {
            display: flex;
            align-items: center;
        }

        .search-container .small-select {
            width: 150px;
            margin-right: 10px;
            padding: 5px;
        }

        .search-container .search-input {
            width: 300px;
            margin-right: 10px;
            padding: 5px;
        }

        .tcps{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
<!--상단바-->
<div th:insert="fragments/header :: header"></div>

<div class="container">

    <h2>코스런 회원 관리 페이지</h2> <!-- 제목 -->
    <div class="tcps">
        <!--  인원 표시  -->
        <span th:text="${totalCount == 0} ? '회원 정보가 없습니다' : (${query == ''} ? '총 ' + ${totalCount} + '명 조회됨' : '총 ' + ${totalCount} + '명 검색됨')"></span>

        <!-- 페이지 크기 선택 -->
        <div class="page-size-container">
            <label for="pageSize">정보 표시:</label>
            <select id="pageSize" name="pageSize" class="form-select small-select" onchange="updatePageSize()">
                <option value="10" th:selected="${pageSize == 10}">10개</option>
                <option value="30" th:selected="${pageSize == 30}">30개</option>
                <option value="50" th:selected="${pageSize == 50}">50개</option>
                <option value="100" th:selected="${pageSize == 100}">100개</option>
            </select>
        </div>

    </div>

    <div class="table-container">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>성별</th>
                <th>등급</th>
                <th>등록일</th>
                <th>수정일</th>
                <th>상세정보</th>
                <th>수정</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody>
            <!-- 유저 목록을 for문으로 반복 -->
            <tr th:each="member : ${members}">
                <td th:text="${member.id}"></td>
                <td th:text="${member.username}"></td>
                <td th:text="${member.name}"></td>
                <td th:text="${member.email}"></td>
                <td th:text="${member.gender}"></td>
                <td>
                    <!-- 현재 등급 표시 -->
                    <span th:id="'roleText_' + ${member.id}" th:text="${member.role}"></span>

                    <!-- 셀렉트 박스는 처음에는 숨겨둠 -->
                    <select th:id="'roleSelect_' + ${member.id}" class="form-select" style="display: none;">
                        <option value="ADMIN" th:selected="${member.role == 'ADMIN'}">ADMIN</option>
                        <option value="INSTRUCTOR" th:selected="${member.role == 'INSTRUCTOR'}">INSTRUCTOR</option>
                        <option value="STUDENT" th:selected="${member.role == 'STUDENT'}">STUDENT</option>
                    </select>
                </td>
                </td>
                <td th:text="${member.createdAtFormatted}"></td>
                <td th:text="${member.updatedAtFormatted}"></td>
                <td>
                    <button type="button" class="btn btn-primary btn-sm" th:onclick="'location.href=\'/admin/users/info?id=' + ${member.id} + '\''">조회 🔎</button>
                </td>
                <td>
                    <form th:id="'form_' + ${member.id}" th:action="@{/admin/users/update}" method="post">
                        <input type="hidden" name="id" th:value="${member.id}">
                        <input type="hidden" name="role" th:id="'hiddenRole_' + ${member.id}">
                        <input type="hidden" name="currentPage" th:value="${paging.currentPage}">
                        <input type="hidden" name="filterType" th:value="${filterType}">
                        <input type="hidden" name="query" th:value="${query}">
                        <input type="hidden" name="pageSize" th:value="${pageSize}">
                        <button th:id="'toggleButton_' + ${member.id}" type="button" class="btn btn-primary btn-sm"
                                th:onclick="'toggleRole(' + ${member.id} + ', event)'">수정 ✍🏻</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/admin/users/delete}" method="post" onsubmit="return deleteAlert()">
                        <input type="hidden" name="id" th:value="${member.id}">
                        <input type="hidden" name="currentPage" th:value="${paging.currentPage}">
                        <input type="hidden" name="filterType" th:value="${filterType}">
                        <input type="hidden" name="query" th:value="${query}">
                        <input type="hidden" name="pageSize" th:value="${pageSize}">
                        <button type="submit" class="btn btn-danger btn-sm">삭제 🗑️</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--검색 폼-->
    <div class="search-container">
        <form th:action="@{/admin/users}" method="get">
            <input type="hidden" name="pageSize" th:value="${pageSize}">
            <select id="filterType" name="filterType" class="form-select small-select">
                <option value="all" th:selected="${filterType == 'all'}">전체</option>
                <option value="id" th:selected="${filterType == 'id'}">ID</option>
                <option value="username" th:selected="${filterType == 'username'}">아이디</option>
                <option value="name" th:selected="${filterType == 'name'}">이름</option>
                <option value="email" th:selected="${filterType == 'email'}">이메일</option>
                <option value="gender" th:selected="${filterType == 'gender'}">성별</option>
                <option value="role" th:selected="${filterType == 'role'}">등급</option>
            </select>
            <input type="text" name="query" class="form-control search-input" placeholder="검색어 입력"
                   th:value="${query}">
            <button type="submit" class="btn btn-primary">검색</button>
        </form>
    </div>



    <!-- 페이지네이션 -->
    <div class="pagination">
        <ul class="pagination">
            <!-- 이전 페이지 버튼 -->
            <li class="page-item" th:classappend="${paging.currentPage == 1} ? 'disabled'">
                <a class="page-link"
                   th:if="${paging.currentPage > 1}"
                   th:href="@{/admin/users(currentPage=${paging.currentPage - 1}, pageSize=${pageSize}, filterType=${filterType}, query=${query})}">
                    이전
                </a>
                <a class="page-link" th:if="${paging.currentPage == 1}" href="#">
                    이전
                </a>
            </li>

            <!-- 페이지 번호들 -->
            <li class="page-item" th:each="i : ${#numbers.sequence(1, paging.totalPages)}"
                th:classappend="${i == paging.currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/users(currentPage=${i}, pageSize=${pageSize}, filterType=${filterType}, query=${query})}"
                   th:text="${i}"></a>
            </li>

            <!-- 다음 페이지 버튼 -->
            <li class="page-item" th:classappend="${paging.currentPage == paging.totalPages} ? 'disabled'">
                <a class="page-link"
                   th:if="${paging.currentPage < paging.totalPages}"
                   th:href="@{/admin/users(currentPage=${paging.currentPage + 1}, pageSize=${pageSize}, filterType=${filterType}, query=${query})}">
                    다음
                </a>
                <a class="page-link" th:if="${paging.currentPage == paging.totalPages}" href="#">
                    다음
                </a>
            </li>
        </ul>
    </div>
</div>

<script>
    function toggleRole(memberId, event) {
        // 폼 제출 기본 동작 방지
        if (event) {
            event.preventDefault();
        }

        // DOM 요소 가져오기
        const roleText = document.querySelector(`#roleText_${memberId}`); // 텍스트 영역
        const roleSelect = document.querySelector(`#roleSelect_${memberId}`); // 셀렉트 박스
        const toggleButton = document.querySelector(`#toggleButton_${memberId}`); // 버튼
        const hiddenRoleInput = document.querySelector(`#hiddenRole_${memberId}`); // 숨겨진 입력값

        if (roleText && roleText.style.display !== "none") {
            // **1. 텍스트 -> 셀렉트 박스 전환**
            roleText.style.display = "none"; // 텍스트 숨김
            roleSelect.style.display = "inline-block"; // 셀렉트 박스 표시
            toggleButton.innerText = "저장"; // 버튼 텍스트를 '저장'으로 변경
        } else if (roleSelect) {
            // **2. 셀렉트 박스 -> 제출 동작**
            const selectedRole = roleSelect.value; // 선택한 등급 값 가져오기
            hiddenRoleInput.value = selectedRole; // 숨겨진 input에 값 설정
            document.querySelector(`#form_${memberId}`).submit(); // 폼 제출
        }
    }

    function deleteAlert() {
        return confirm('정말 삭제하시겠습니까?'); // 삭제 확인 창 표시
    }

        function updatePageSize() {
        const pageSize = document.getElementById('pageSize').value;
        const params = new URLSearchParams(window.location.search);

        // 기존 검색 조건 유지
        const filterType = params.get('filterType') || 'all';
        const query = params.get('query') || '';

        params.set('pageSize', pageSize);
        params.set('filterType', filterType);
        params.set('query', query);

        // 페이지 크기 변경 시 URL 갱신
        window.location.href = window.location.pathname + '?' + params.toString();
    }

</script>

<!--<link rel="stylesheet" th:href="@{/js/header.js}">-->

<!-- Bootstrap JS 및 jQuery 추가 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
