<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .search-bar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
        .table-custom td, .table-custom th { text-align:center; white-space:nowrap; }
        .table-custom td { overflow:hidden; text-overflow:ellipsis; max-width:160px; }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">관리자 메뉴</div>
        <a href="/admin/home"><i class="bi bi-speedometer2"></i> 대시보드</a>
        <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성</a>
        <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        <a href="/admin/courselist"><i class="bi bi-play-circle"></i> 강의 관리</a>
        <a href="/admin/payment"><i class="bi bi-credit-card"></i> 결제 관리</a>
        <a href="/admin/users" class="active"><i class="bi bi-people"></i> 회원 관리</a>
        <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">회원 관리</h1>
        <p class="page-subtitle">코스런 회원 정보를 관리하세요</p>

        <div class="card">
            <div class="top-bar">
                <span style="font-size:14px; color:#555;" th:text="${totalCount == 0} ? '회원 정보가 없습니다' : (${query == ''} ? '총 ' + ${totalCount} + '명 조회됨' : '총 ' + ${totalCount} + '명 검색됨')"></span>
                <div style="display:flex; align-items:center; gap:6px; font-size:13px;">
                    <label for="pageSize">표시:</label>
                    <select id="pageSize" name="pageSize" class="form-input" style="width:80px; padding:6px 10px;" onchange="updatePageSize()">
                        <option value="10" th:selected="${pageSize == 10}">10개</option>
                        <option value="30" th:selected="${pageSize == 30}">30개</option>
                        <option value="50" th:selected="${pageSize == 50}">50개</option>
                        <option value="100" th:selected="${pageSize == 100}">100개</option>
                    </select>
                </div>
            </div>

            <div style="overflow-x:auto;">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th>ID</th><th>아이디</th><th>이름</th><th>이메일</th><th>성별</th><th>등급</th><th>등록일</th><th>수정일</th><th>상세</th><th>수정</th><th>삭제</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="member : ${members}">
                        <td th:text="${member.id}"></td>
                        <td th:text="${member.username}"></td>
                        <td th:text="${member.name}"></td>
                        <td th:text="${member.email}"></td>
                        <td th:text="${member.gender}"></td>
                        <td>
                            <span th:id="'roleText_' + ${member.id}" th:text="${member.role}"></span>
                            <select th:id="'roleSelect_' + ${member.id}" class="form-input" style="display:none; width:110px; padding:4px 8px; font-size:12px;">
                                <option value="ADMIN" th:selected="${member.role == 'ADMIN'}">ADMIN</option>
                                <option value="INSTRUCTOR" th:selected="${member.role == 'INSTRUCTOR'}">INSTRUCTOR</option>
                                <option value="STUDENT" th:selected="${member.role == 'STUDENT'}">STUDENT</option>
                            </select>
                        </td>
                        <td th:text="${member.createdAtFormatted}"></td>
                        <td th:text="${member.updatedAtFormatted}"></td>
                        <td>
                            <button type="button" class="btn-primary-custom" style="padding:4px 10px; font-size:12px;" th:onclick="'location.href=\'/admin/users/info?id=' + ${member.id} + '\''"><i class="bi bi-search"></i></button>
                        </td>
                        <td>
                            <form th:id="'form_' + ${member.id}" th:action="@{/admin/users/update}" method="post">
                                <input type="hidden" name="id" th:value="${member.id}">
                                <input type="hidden" name="role" th:id="'hiddenRole_' + ${member.id}">
                                <input type="hidden" name="currentPage" th:value="${paging.currentPage}">
                                <input type="hidden" name="filterType" th:value="${filterType}">
                                <input type="hidden" name="query" th:value="${query}">
                                <input type="hidden" name="pageSize" th:value="${pageSize}">
                                <button th:id="'toggleButton_' + ${member.id}" type="button" class="btn-primary-custom" style="padding:4px 10px; font-size:12px;"
                                        th:onclick="'toggleRole(' + ${member.id} + ', event)'"><i class="bi bi-pencil"></i></button>
                            </form>
                        </td>
                        <td>
                            <form th:action="@{/admin/users/delete}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?')">
                                <input type="hidden" name="id" th:value="${member.id}">
                                <input type="hidden" name="currentPage" th:value="${paging.currentPage}">
                                <input type="hidden" name="filterType" th:value="${filterType}">
                                <input type="hidden" name="query" th:value="${query}">
                                <input type="hidden" name="pageSize" th:value="${pageSize}">
                                <button type="submit" class="btn-danger-custom" style="padding:4px 10px; font-size:12px;"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="search-bar" style="margin-top:20px; justify-content:center;">
                <form th:action="@{/admin/users}" method="get" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <input type="hidden" name="pageSize" th:value="${pageSize}">
                    <select id="filterType" name="filterType" class="form-input" style="width:100px;">
                        <option value="all" th:selected="${filterType == 'all'}">전체</option>
                        <option value="id" th:selected="${filterType == 'id'}">ID</option>
                        <option value="username" th:selected="${filterType == 'username'}">아이디</option>
                        <option value="name" th:selected="${filterType == 'name'}">이름</option>
                        <option value="email" th:selected="${filterType == 'email'}">이메일</option>
                        <option value="gender" th:selected="${filterType == 'gender'}">성별</option>
                        <option value="role" th:selected="${filterType == 'role'}">등급</option>
                    </select>
                    <input type="text" name="query" class="form-input" placeholder="검색어 입력" th:value="${query}" style="width:200px;">
                    <button type="submit" class="btn-primary-custom" style="padding:10px 20px;">검색</button>
                </form>
            </div>

            <div class="pagination-custom">
                <a th:href="@{/admin/users(currentPage=${paging.currentPage - 1}, pageSize=${pageSize}, filterType=${filterType}, query=${query})}"
                   th:if="${paging.currentPage > 1}">이전</a>
                <span th:each="i : ${#numbers.sequence(1, paging.totalPages)}">
                    <a th:href="@{/admin/users(currentPage=${i}, pageSize=${pageSize}, filterType=${filterType}, query=${query})}"
                       th:classappend="${i == paging.currentPage} ? ' active'" th:text="${i}"></a>
                </span>
                <a th:href="@{/admin/users(currentPage=${paging.currentPage + 1}, pageSize=${pageSize}, filterType=${filterType}, query=${query})}"
                   th:if="${paging.currentPage < paging.totalPages}">다음</a>
            </div>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
function toggleRole(memberId, event) {
    if (event) event.preventDefault();
    const roleText = document.querySelector(`#roleText_${memberId}`);
    const roleSelect = document.querySelector(`#roleSelect_${memberId}`);
    const toggleButton = document.querySelector(`#toggleButton_${memberId}`);
    const hiddenRoleInput = document.querySelector(`#hiddenRole_${memberId}`);

    if (roleText && roleText.style.display !== "none") {
        roleText.style.display = "none";
        roleSelect.style.display = "inline-block";
        toggleButton.innerHTML = '<i class="bi bi-check-lg"></i>';
    } else if (roleSelect) {
        hiddenRoleInput.value = roleSelect.value;
        document.querySelector(`#form_${memberId}`).submit();
    }
}

function updatePageSize() {
    const pageSize = document.getElementById('pageSize').value;
    const params = new URLSearchParams(window.location.search);
    params.set('pageSize', pageSize);
    params.set('filterType', params.get('filterType') || 'all');
    params.set('query', params.get('query') || '');
    window.location.href = window.location.pathname + '?' + params.toString();
}
</script>
</body>
</html>
