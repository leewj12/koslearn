<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>권한 없음 - 코스런</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:-apple-system,'Segoe UI',sans-serif; background:#f5f5f9; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .error-card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:48px; max-width:480px; text-align:center; animation:fadeInUp .6s ease-out; }
        .error-icon { font-size:3rem; color:#ff4757; margin-bottom:16px; }
        .error-card h1 { font-size:1.5rem; font-weight:800; color:#1a1a2e; margin-bottom:12px; }
        .error-card p { font-size:14px; color:#666; line-height:1.6; margin-bottom:24px; }
        .btn-home { display:inline-block; padding:12px 28px; background:#6c63ff; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; transition:background .2s; }
        .btn-home:hover { background:#5a52d5; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon"><i class="bi bi-shield-exclamation"></i></div>
    <h1>권한이 없습니다</h1>
    <p>이 페이지에 접근할 권한이 없습니다.<br>관리자에게 문의하거나, 다른 페이지로 이동하세요.</p>
    <a href="/" th:href="@{/}" class="btn-home">홈으로 가기</a>
</div>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
