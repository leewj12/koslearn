<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 - 코스런</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .error-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            max-width: 440px;
            width: 100%;
            padding: 48px 36px;
            text-align: center;
        }
        .error-icon {
            font-size: 4rem;
            color: #6c63ff;
            margin-bottom: 20px;
        }
        .error-card h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .error-card p {
            font-size: 15px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 28px;
            background: #6c63ff;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            transition: background .2s;
        }
        .btn-home:hover { background: #5a52d5; }
        .btn-back {
            display: inline-block;
            padding: 12px 28px;
            background: transparent;
            color: #888;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            border: 1.5px solid #ddd;
            transition: all .2s;
        }
        .btn-back:hover {
            border-color: #6c63ff;
            color: #6c63ff;
        }
        @media (max-width: 480px) {
            .error-card { padding: 32px 20px; }
            .error-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <h1>페이지를 불러올 수 없습니다</h1>
    <p>요청하신 페이지에 일시적인 문제가 있거나<br>아직 준비중인 기능입니다.</p>
    <div class="error-actions">
        <a href="/" class="btn-home">홈으로</a>
        <a href="javascript:history.back()" class="btn-back">이전 페이지</a>
    </div>
</div>
</body>
</html>
