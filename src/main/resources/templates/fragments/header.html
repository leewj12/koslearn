<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
<header th:fragment="header">
  <div class="logo">
    <a href="/home">
      <h1>온라인 강의 코스런</h1>
    </a>
  </div>

  <nav>
    <ul class="nav">
      <li><a href="/home"><i class="bi bi-house-door"></i> 홈</a></li>
      <li><a href="javascript:void(0)" onclick="alert('준비중인 기능입니다.')"><i class="bi bi-bell"></i> 공지사항</a></li>
      <li><a href="/course/view"><i class="bi bi-play-circle"></i> 강의보기</a></li>
      <li><a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a></li>

      <li><a href="/login" sec:authorize="!isAuthenticated()"><i class="bi bi-box-arrow-in-right"></i> 로그인</a></li>
      <li><a href="/signup" sec:authorize="!isAuthenticated()"><i class="bi bi-person-plus"></i> 회원가입</a></li>

      <!-- 로그인 후 보여지는 메뉴들 -->
      <li><a href="/my/mypage" sec:authorize="hasRole('ROLE_STUDENT')"><i class="bi bi-person-circle"></i> 마이페이지</a></li>
      <li><a href="/cart/purchase" sec:authorize="hasRole('ROLE_STUDENT')"><i class="bi bi-cart"></i> 장바구니</a></li>
      <li><a href="/instructor/myinstructor" sec:authorize="hasRole('ROLE_INSTRUCTOR')"><i class="bi bi-person-bounding-box"></i> 강사 마이페이지</a></li>
      <li><a href="/admin/home" sec:authorize="hasRole('ROLE_ADMIN')"><i class="bi bi-person-check"></i> 관리자 페이지</a></li>

      <li><a href="/logout" sec:authorize="isAuthenticated()"><i class="bi bi-box-arrow-right"></i> 로그아웃</a></li>

      <!-- 로그인한 사용자의 아이디와 환영 메시지 -->
      <li sec:authorize="isAuthenticated()">
        <span>환영합니다, <span th:text="${#authentication.name}"></span>님! <i class="bi bi-person-check"></i></span>
      </li>
    </ul>
  </nav>

  <!-- 햄버거 메뉴 -->
  <div class="hamburger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>
</header>
</body>
</html>
