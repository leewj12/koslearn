<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 작성 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">관리자 메뉴</div>
        <a href="/admin/home"><i class="bi bi-speedometer2"></i> 대시보드</a>
        <a href="/admin/notice" class="active"><i class="bi bi-pencil-square"></i> 공지사항 작성</a>
        <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        <a href="/admin/courselist"><i class="bi bi-play-circle"></i> 강의 관리</a>
        <a href="/admin/payment"><i class="bi bi-credit-card"></i> 결제 관리</a>
        <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">공지사항 작성</h1>
        <p class="page-subtitle">새로운 공지사항을 등록하세요</p>

        <div class="card" style="max-width: 720px;">
            <form th:action="@{/admin/notice}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="form-label-custom">제목</label>
                    <input type="text" class="form-input" name="title" required placeholder="공지사항 제목을 입력하세요">
                </div>
                <div class="form-group">
                    <label class="form-label-custom">내용</label>
                    <textarea class="form-input" name="content" rows="8" required placeholder="공지사항 내용을 입력하세요"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">썸네일 이미지</label>
                    <input type="file" class="form-input" name="thumbnailImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label class="form-label-custom">배너 이미지</label>
                    <input type="file" class="form-input" name="bannerImage" accept="image/*">
                </div>
                <button type="submit" class="btn-primary-custom" style="margin-top:8px;">공지사항 등록</button>
            </form>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

</body>
</html>
