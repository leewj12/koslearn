<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/homecss/footer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div style="max-width:1100px; margin:0 auto; padding:32px 20px;">
    <h1 class="page-title">공지사항</h1>
    <p class="page-subtitle">코스런의 새로운 소식을 확인하세요</p>

    <form th:action="@{/noticeview}" method="get" style="display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;">
        <select name="searchOption" class="form-input" style="width:120px;">
            <option value="all" th:selected="${searchOption == 'all'}">전체</option>
            <option value="title" th:selected="${searchOption == 'title'}">제목</option>
            <option value="content" th:selected="${searchOption == 'content'}">내용</option>
        </select>
        <input type="text" name="searchKeyword" class="form-input" th:value="${searchKeyword}" placeholder="검색어를 입력하세요" style="flex:1; min-width:160px;">
        <button type="submit" class="btn-primary-custom">검색</button>
    </form>

    <div th:if="${pagingDTO != null and pagingDTO.noticeList != null and !#lists.isEmpty(pagingDTO.noticeList)}">
        <div class="notice-grid">
            <a th:each="notice : ${pagingDTO.noticeList}" th:href="@{/noticeview/{id}(id=${notice.id})}" class="notice-card">
                <img th:if="${notice.hashedThumbnailImage != null}" th:src="@{'/notice/' + ${notice.hashedThumbnailImage}}" alt="썸네일">
                <img th:if="${notice.hashedThumbnailImage == null}" src="/homeimages/category/webDev.png" alt="기본 이미지">
                <div class="notice-card-body">
                    <h3 th:text="${notice.title}"></h3>
                    <p><span th:text="${notice.created_at}"></span> · 조회 <span th:text="${notice.views}"></span></p>
                </div>
            </a>
        </div>

        <div class="pagination-custom" th:if="${pagingDTO.totalPages > 0}">
            <a th:href="@{/noticeview(currentPage=${pagingDTO.currentPage - 1}, searchKeyword=${searchKeyword}, searchOption=${searchOption})}"
               th:if="${pagingDTO.currentPage > 1}">이전</a>
            <th:block th:if="${pagingDTO.startPage <= pagingDTO.endPage}">
                <span th:each="i : ${#numbers.sequence(pagingDTO.startPage, pagingDTO.endPage)}">
                    <a th:href="@{/noticeview(currentPage=${i}, searchKeyword=${searchKeyword}, searchOption=${searchOption})}"
                       th:classappend="${pagingDTO.currentPage == i} ? ' active'" th:text="${i}"></a>
                </span>
            </th:block>
            <a th:href="@{/noticeview(currentPage=${pagingDTO.currentPage + 1}, searchKeyword=${searchKeyword}, searchOption=${searchOption})}"
               th:if="${pagingDTO.currentPage < pagingDTO.totalPages}">다음</a>
        </div>
    </div>

    <div th:if="${pagingDTO == null or pagingDTO.noticeList == null or #lists.isEmpty(pagingDTO.noticeList)}" class="empty-state">
        <i class="bi bi-megaphone"></i>
        <p>등록된 공지사항이 없습니다.</p>
    </div>
</div>

<div th:insert="fragments/footer :: footer"></div>

</body>
</html>
