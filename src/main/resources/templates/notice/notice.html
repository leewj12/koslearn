<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 이미지 아이콘 부트스트랩 -->
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <style>
        /* 공지사항 목록을 감싸는 컨테이너 */
        .notice-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px; /* 항목 간의 간격 */
             justify-content: center;
            align-items: stretch; /* 자식 요소들의 높이를 동일하게 맞춤 */

        }

        /* 각 공지사항 항목을 감싸는 컨테이너 */
        .notice-item-container {
            width: 22%; /* 항목의 너비 */
            margin-bottom: 20px; /* 아래쪽 간격 */
        }

        /* 실제 공지사항 항목의 스타일 */
        .notice-item {
            border: 2px solid #dcdcdc; /* 테두리 색상과 굵기 */
            border-radius: 5px; /* 둥근 모서리 */
            overflow: hidden; /* 넘치는 내용 숨기기 */
            display: block; /* 링크 요소를 블록 요소로 */
            background-color: #fff; /* 배경색 */
            text-decoration: none; /* 기본 링크 스타일 제거 */
             justify-content: center; /* 항목들을 중앙 정렬 */
        }

        /* 공지사항의 내용 부분 */
        .notice-content {
            padding: 10px; /* 패딩 */
        }

        /* 공지사항 제목 스타일 */
        .notice-header {
            font-size: 18px; /* 글자 크기 */
            font-weight: bold; /* 굵은 글씨 */
            color: black; /* 글자 색 */
        }

        /* 공지사항 세부사항 스타일 */
        .notice-details {
            font-size: 14px; /* 글자 크기 */
            color: gray; /* 글자 색 */
        }

        /* 링크의 기본 스타일 제거 */
        .notice-item a {
            text-decoration: none !important; /* 밑줄 제거 */
            color: inherit; /* 부모 색상 유지 */
        }

        .notice-item a:hover {
            text-decoration: none !important; /* 마우스 오버 시 밑줄 제거 */
        }

        /* 버튼 그룹 스타일 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn-group .btn {
            flex: 1 0 calc(25% - 10px); /* 버튼 4개 열 크기 */
            font-weight: bold;
            text-align: center;
        }

        /* 검색 폼 */
        .search-form {
            margin-bottom: 30px;
        }

        /* 전체 내용 중앙 정렬 */
        .container {
            max-width: 1400px;
        }

        .pagination {
            justify-content: center;
        }

        /* 썸네일 이미지 고정 */
        .notice-thumbnail {
            width: 100%;
            height: 200px; /* 썸네일 높이 고정 */
            object-fit: contain; /* 이미지 비율 유지 */
            object-position: center; /* 이미지 가운데 배치 */
        }

        a {
            text-decoration: none; /* 링크 밑줄 제거 */
        }

         .pagination .active .page-link {
        background-color: #007bff; /* 선택된 페이지에 파란색 배경 */
        border-color: #007bff; /* 선택된 페이지의 테두리 색 */
        color: white; /* 텍스트 색 */
    }

    .pagination .disabled .page-link {
        color: #6c757d; /* 비활성화된 링크 색 */
        pointer-events: none; /* 클릭 방지 */
    }



    </style>
</head>
<body>
<!-- 헤더 -->
<div th:insert="~{fragments/header :: header}"></div>

<div class="container my-5">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">📢 코스런 공지사항</h1>
        <p class="text-secondary">최신 공지와 이벤트 정보를 확인하세요!</p>
    </div>

    <!-- 카테고리 버튼 -->
    <div class="row mb-4">
        <div class="col text-center">
            <div class="btn-group" role="group" aria-label="카테고리">
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-house-door"></i> 전체
                </button>
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-megaphone"></i> 공지사항
                </button>
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-calendar-event"></i> 강의 이벤트
                </button>
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-book"></i> 학습 자료
                </button>
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-person-badge"></i> 강사 소식
                </button>
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-chat-square-text"></i> 학생 후기
                </button>
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-exclamation-circle"></i> 시스템 공지
                </button>
                <button type="button" class="btn btn-outline-dark">
                    <i class="bi bi-three-dots"></i> 기타
                </button>
            </div>
        </div>
    </div>

    <!-- 검색 폼 -->
    <form th:action="@{/noticeview}" method="get" class="search-form">
        <div class="row mb-3 align-items-center">
            <div class="col-md-2 text-center">
                <div class="btn-group w-100" role="group" aria-label="검색 옵션">
                    <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <span th:text="${searchOption != null ? (searchOption == 'title' ? '제목' : (searchOption == 'content' ? '내용' : '전체')) : '전체'}">전체</span>
                    </button>
                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item" th:href="@{/noticeview(currentPage=1, searchKeyword=${searchKeyword}, searchOption='title')}">제목</a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/noticeview(currentPage=1, searchKeyword=${searchKeyword}, searchOption='content')}">내용</a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/noticeview(currentPage=1, searchKeyword=${searchKeyword}, searchOption='all')}">전체</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-md-8">
                <input type="text" name="searchKeyword" class="form-control" placeholder="검색어를 입력하세요" th:value="${searchKeyword}">
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">검색</button>
            </div>

            <input type="hidden" name="searchOption" th:value="${searchOption != null ? searchOption : 'all'}">
        </div>
    </form>

    <!-- 공지사항 목록 -->
    <div th:if="${pagingDTO != null and pagingDTO.noticeList != null and !pagingDTO.noticeList.isEmpty()}" class="notice-list">
        <div th:each="notice : ${pagingDTO.noticeList}" class="notice-item-container">
            <a th:href="@{/noticeview/{id}(id=${notice.noticeid})}" class="notice-item">
                <img class="notice-thumbnail" th:src="@{'/notice/' + ${notice.hashedThumbnailImage}}" alt="썸네일 이미지"/>
                <div class="notice-content">
                    <div class="notice-header">
                        <span th:text="${notice.title}"></span>
                    </div>
                    <div class="notice-details">
                        <span th:text="${notice.username}"></span> |
                        조회수 <span th:text="${notice.views_count}"></span> |
                        <span th:text="${notice.createdAtFormatted}"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <div th:if="${pagingDTO == null or pagingDTO.noticeList == null or pagingDTO.noticeList.isEmpty()}" class="text-center py-5">
        <i class="bi bi-info-circle" style="font-size: 3rem; color: #6c757d;"></i>
        <p class="mt-3 text-secondary" style="font-size: 1.1rem;">등록된 공지사항이 없습니다.</p>
    </div>

    <!-- 페이징 -->
    <nav th:if="${pagingDTO != null and pagingDTO.noticeList != null and !pagingDTO.noticeList.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagingDTO.currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/noticeview(currentPage=${pagingDTO.currentPage - 1}, searchKeyword=${searchKeyword}, searchOption=${searchOption})}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(pagingDTO.startPage, pagingDTO.endPage)}"
                th:classappend="${pagingDTO.currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/noticeview(currentPage=${i}, searchKeyword=${searchKeyword}, searchOption=${searchOption})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${pagingDTO.currentPage == pagingDTO.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/noticeview(currentPage=${pagingDTO.currentPage + 1}, searchKeyword=${searchKeyword}, searchOption=${searchOption})}">다음</a>
            </li>
        </ul>
    </nav>
</div>

<!-- 부트스트랩 JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>





</body>
</html>
