<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/homecss/footer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div style="max-width:800px; margin:0 auto; padding:32px 20px;">
    <a href="/noticeview" class="btn-secondary-custom" style="margin-bottom:20px; display:inline-block;"><i class="bi bi-arrow-left"></i> 목록</a>

    <div class="card">
        <h1 class="page-title" th:text="${noticeviewall.title}">공지사항 제목</h1>
        <div style="display:flex; gap:16px; font-size:13px; color:#888; margin-bottom:20px;">
            <span><i class="bi bi-person"></i> <span th:text="${noticeviewall.author}">작성자</span></span>
            <span><i class="bi bi-calendar"></i> <span th:text="${noticeviewall.created_at}">날짜</span></span>
            <span><i class="bi bi-eye"></i> 조회 <span th:text="${noticeviewall.views}">0</span></span>
        </div>

        <div th:if="${noticeviewall.hashedBannerImage != null}" style="margin-bottom:20px;">
            <img th:src="@{'/notice/' + ${noticeviewall.hashedBannerImage}}" alt="배너" style="width:100%; border-radius:8px;">
        </div>

        <div style="line-height:1.8; font-size:15px; color:#444;" th:text="${noticeviewall.content}">내용</div>
    </div>
</div>

<div th:insert="fragments/footer :: footer"></div>

</body>
</html>
