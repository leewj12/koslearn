<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/homecss/footer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .category-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .category-bar a {
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
            text-decoration: none; color: #666; border: 1.5px solid #e0e0e0; transition: all .2s; cursor: pointer;
        }
        .category-bar a:hover, .category-bar a.on { background: #6c63ff; color: #fff; border-color: #6c63ff; }
        .search-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .search-row select { width: 120px; }
        .search-row input { flex: 1; min-width: 160px; }
        .file-icon { width: 16px; height: 16px; margin-left: 6px; vertical-align: middle; }
        .new-badge { color: #ff4757; font-size: 11px; font-weight: 700; margin-left: 4px; }
    </style>
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div style="max-width:1100px; margin:0 auto; padding:32px 20px;">
    <h1 class="page-title">커뮤니티</h1>
    <p class="page-subtitle">자유롭게 소통하고 정보를 나누세요</p>

    <div class="search-row">
        <form th:action="@{/community/list}" method="get" style="display:flex; gap:8px; flex:1; flex-wrap:wrap; align-items:center;">
            <select id="filterType" name="filterType" class="form-input" style="width:120px;">
                <option value="all">전체</option>
                <option value="title">제목</option>
                <option value="category">카테고리</option>
                <option value="username">작성자</option>
            </select>
            <input type="text" name="query" id="search" class="form-input" placeholder="검색..." style="flex:1; min-width:160px;">
            <button type="submit" class="btn-primary-custom" style="padding:10px 20px;">검색</button>
        </form>
        <button class="btn-primary-custom" onclick="window.location.href='/community/post';">
            <i class="bi bi-pencil"></i> 글쓰기
        </button>
    </div>

    <div class="category-bar">
        <a href="#" onclick="filtercategory('질문답변')"><i class="bi bi-question-circle"></i> 질문답변</a>
        <a href="#" onclick="filtercategory('고민상담')"><i class="bi bi-chat-dots"></i> 고민상담</a>
        <a href="#" onclick="filtercategory('진로상담')"><i class="bi bi-compass"></i> 진로상담</a>
        <a href="#" onclick="filtercategory('팀프로젝트')"><i class="bi bi-people"></i> 팀프로젝트</a>
        <a href="#" onclick="filtercategory('채용')"><i class="bi bi-briefcase"></i> 채용</a>
        <a href="#" onclick="filtercategory('블로그')"><i class="bi bi-journal"></i> 블로그</a>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
        <table class="table-custom">
            <thead>
            <tr>
                <th style="width:60px;">번호</th>
                <th>제목</th>
                <th style="width:100px;">카테고리</th>
                <th style="width:100px;">등록일</th>
                <th style="width:90px;">작성자</th>
                <th style="width:60px;">조회</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.postId}"></td>
                <td>
                    <a th:href="@{/community/communityview/{postId}(postId=${post.postId})}" style="color:#333; text-decoration:none; font-weight:500;">
                        <span th:text="${post.title}"></span>
                    </a>
                    <span th:if="${post.createdAtFormattedNew != null and post.createdAtFormattedNew == #dates.format(#dates.createNow(), 'yyyy-MM-dd')}" class="new-badge">New</span>
                    <img th:if="${post.originFileName != null}" th:src="@{/communityupload/files/img.png}" class="file-icon">
                </td>
                <td><span class="badge-custom badge-purple" th:text="${post.category}"></span></td>
                <td th:text="${post.createdAtFormatted}" style="font-size:13px; color:#888;"></td>
                <td th:text="${post.username}" style="font-size:13px;"></td>
                <td th:text="${post.read_view}" style="font-size:13px; color:#888;"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-custom" style="margin-top:24px;">
        <a th:href="@{/community/list(currentPage=1, filterType=${filterType}, query=${query}, category=${selectedCategory})}"
           th:classappend="${paging.currentPage == 1} ? ' disabled'" style="pointer-events:auto;">&laquo;</a>
        <a th:href="@{/community/list(currentPage=${paging.startPage - 1}, filterType=${filterType}, query=${query}, category=${selectedCategory})}"
           th:classappend="${paging.startPage == 1} ? ' disabled'">이전</a>
        <span th:each="i : ${#numbers.sequence(paging.startPage, paging.endPage)}">
            <a th:href="@{/community/list(currentPage=${i}, filterType=${filterType}, query=${query}, category=${selectedCategory})}"
               th:classappend="${paging.currentPage == i} ? ' active'" th:text="${i}"></a>
        </span>
        <a th:href="@{/community/list(currentPage=${paging.endPage + 1}, filterType=${filterType}, query=${query}, category=${selectedCategory})}"
           th:classappend="${paging.endPage == paging.totalPages} ? ' disabled'">다음</a>
        <a th:href="@{/community/list(currentPage=${paging.totalPages}, filterType=${filterType}, query=${query}, category=${selectedCategory})}"
           th:classappend="${paging.currentPage == paging.totalPages} ? ' disabled'">&raquo;</a>
    </div>
</div>

<div th:insert="fragments/footer :: footer"></div>

<script>
let selectedCategory = '';
async function filtercategory(category, page) {
    page = page || 1;
    selectedCategory = category;
    const filterType = document.querySelector("#filterType").value;
    const query = document.querySelector("#search").value;
    try {
        const r = await fetch('/community/filter?category=' + category + '&page=' + page + '&filterType=' + filterType + '&query=' + query);
        if (r.ok) {
            const data = await r.json();
            const tbody = document.querySelector('table tbody');
            tbody.innerHTML = '';
            data.posts.forEach(function(post) {
                tbody.innerHTML += '<tr><td>' + post.postId + '</td><td><a href="/community/communityview/' + post.postId + '" style="color:#333;text-decoration:none;font-weight:500;">' + post.title + '</a></td><td><span class="badge-custom badge-purple">' + post.category + '</span></td><td style="font-size:13px;color:#888;">' + post.createdAtFormattedNew + '</td><td style="font-size:13px;">' + post.username + '</td><td style="font-size:13px;color:#888;">' + post.read_view + '</td></tr>';
            });
        }
    } catch (e) { console.error(e); }
}
</script>
</body>
</html>
