<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .post-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .post-layout { grid-template-columns: 1fr; } }
        .post-meta { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin: 12px 0 20px; }
        .comment { background: #f9f9fc; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .comment-meta { font-size: 12px; color: #888; margin-bottom: 4px; }
        .comment-content { font-size: 14px; }
        .attachment-img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
    </style>
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div style="max-width:1100px; margin:0 auto; padding:32px 20px;">
    <a href="/community/list" class="btn-secondary-custom" style="margin-bottom:20px; display:inline-block;"><i class="bi bi-arrow-left"></i> 목록</a>

    <div class="post-layout">
        <div class="card">
            <form action="/community/edit" method="post" enctype="multipart/form-data">
                <input type="text" name="title" class="form-input editable" th:value="${post.title}" readonly style="font-size:18px; font-weight:700; border:none; padding:0; background:transparent;">
                <div class="post-meta">
                    <span>작성자: <span th:text="${#authentication.principal.username}"></span></span>
                    <span>작성일: <span th:text="${post.createdAtFormatted}"></span></span>
                </div>
                <select id="category" name="category" class="form-input editable" required style="max-width:160px; margin-bottom:12px;" disabled>
                    <option value="질문답변" th:selected="${post.category == '질문답변'}">질문답변</option>
                    <option value="고민상담" th:selected="${post.category == '고민상담'}">고민상담</option>
                    <option value="진로상담" th:selected="${post.category == '진로상담'}">진로상담</option>
                    <option value="팀프로젝트" th:selected="${post.category == '팀프로젝트'}">팀프로젝트</option>
                    <option value="채용" th:selected="${post.category == '채용'}">채용</option>
                    <option value="블로그" th:selected="${post.category == '블로그'}">블로그</option>
                </select>
                <textarea name="content" class="form-input editable" rows="10" readonly th:text="${post.content}" style="margin-bottom:16px;"></textarea>
                <input type="hidden" name="postId" th:value="${post.postId}">

                <div th:if="${post.originFileName != null}">
                    <img th:if="${#strings.endsWith(post.originFileName, '.jpg') or #strings.endsWith(post.originFileName, '.png') or #strings.endsWith(post.originFileName, '.gif')}"
                         th:src="@{'/communityupload/files/'+ ${post.uuidFileName}}" class="attachment-img" alt="첨부파일">
                </div>

                <div class="file-input-container" style="display:none; margin:12px 0;">
                    <label class="form-label-custom">이미지 첨부</label>
                    <input type="file" name="fileName" accept="image/*" class="form-input">
                </div>

                <div th:if="${post.originFileName != null}" style="margin:12px 0;">
                    <a th:if="${#strings.endsWith(post.originFileName, '.jpg') or #strings.endsWith(post.originFileName, '.png') or #strings.endsWith(post.originFileName, '.gif')}"
                       th:href="@{'/communityupload/files/' + ${post.uuidFileName}}" download class="btn-secondary-custom" style="font-size:12px; padding:6px 14px;">
                        <i class="bi bi-download"></i> 이미지 다운로드
                    </a>
                    <a th:if="${!(#strings.endsWith(post.originFileName, '.jpg') or #strings.endsWith(post.originFileName, '.png') or #strings.endsWith(post.originFileName, '.gif'))}"
                       th:href="@{'/communityupload/file/' + ${post.uuidFileName}}" download class="btn-secondary-custom" style="font-size:12px; padding:6px 14px;">
                        <i class="bi bi-download"></i> 파일 다운로드
                    </a>
                </div>

                <div style="display:flex; gap:8px; margin-top:16px;">
                    <button type="button" class="btn-primary-custom edit-btn" onclick="enableEditing()">수정</button>
                    <button type="submit" class="btn-primary-custom save-btn" style="display:none;">저장</button>
            </form>
            <form action="/community/delete" method="post" style="display:inline;" onsubmit="return confirm('정말로 삭제하시겠습니까?');">
                <input type="hidden" name="postId" th:value="${post.postId}">
                <button type="submit" class="btn-danger-custom">삭제</button>
            </form>
                </div>
        </div>

        <div class="card">
            <div class="card-header-custom">댓글</div>
            <form action="/community/comment" method="post" style="margin-bottom:16px;">
                <textarea name="content" class="form-input" rows="3" placeholder="댓글을 입력하세요..." required></textarea>
                <input type="hidden" name="postId" th:value="${post.postId}">
                <input type="hidden" name="username" th:value="${#authentication.principal.username}">
                <button type="submit" class="btn-primary-custom" style="margin-top:8px; width:100%;">댓글 작성</button>
            </form>
            <div th:each="comment : ${comments}" class="comment">
                <div class="comment-meta" th:text="${comment.username}"></div>
                <div class="comment-content" th:text="${comment.content}"></div>
                <form action="/delete" method="post" th:if="${comment.username == #authentication.principal.username}"
                      style="text-align:right; margin-top:6px;" onsubmit="return confirm('댓글을 삭제하시겠습니까?');">
                    <input type="hidden" name="postId" th:value="${post.postId}">
                    <input type="hidden" name="review_id" th:value="${comment.review_id}">
                    <button type="submit" class="btn-danger-custom" style="padding:4px 10px; font-size:11px;">삭제</button>
                </form>
            </div>
            <div th:if="${#lists.isEmpty(comments)}" style="text-align:center; color:#999; padding:20px; font-size:14px;">
                아직 댓글이 없습니다.
            </div>
        </div>
    </div>
</div>

<script>
function enableEditing() {
    document.querySelectorAll('.editable').forEach(function(f) {
        f.removeAttribute('readonly');
        f.removeAttribute('disabled');
        f.style.background = '#fff';
        f.style.border = '1.5px solid #6c63ff';
    });
    document.querySelector('.edit-btn').style.display = 'none';
    document.querySelector('.save-btn').style.display = 'inline-block';
    var fc = document.querySelector('.file-input-container');
    if (fc) fc.style.display = 'block';
}
</script>
</body>
</html>
