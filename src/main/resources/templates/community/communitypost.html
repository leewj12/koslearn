<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div style="max-width:720px; margin:0 auto; padding:32px 20px;">
    <h1 class="page-title">글쓰기</h1>
    <p class="page-subtitle">커뮤니티에 새 글을 작성하세요</p>

    <div class="card">
        <form action="/community/write" method="post" enctype="multipart/form-data">
            <input type="hidden" name="username" th:value="${#authentication.principal.username}">
            <input type="hidden" name="userId" th:value="${#authentication.principal.id}">
            <input type="hidden" name="mode" value="write">

            <div class="form-group">
                <label class="form-label-custom">제목</label>
                <input type="text" class="form-input" id="title" name="title" required placeholder="제목을 입력하세요">
            </div>

            <div class="form-group">
                <label class="form-label-custom">카테고리</label>
                <select class="form-input" id="category" name="category" required style="max-width:200px;">
                    <option value="" disabled selected>선택하세요</option>
                    <option value="질문답변">질문답변</option>
                    <option value="고민상담">고민상담</option>
                    <option value="진로상담">진로상담</option>
                    <option value="팀프로젝트">팀프로젝트</option>
                    <option value="채용">채용</option>
                    <option value="블로그">블로그</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label-custom">본문</label>
                <textarea class="form-input" id="content" name="content" rows="10" placeholder="내용을 입력하세요"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label-custom">첨부 파일</label>
                <input type="file" class="form-input" id="fileName" name="fileName" accept="*/*">
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn-primary-custom">작성하기</button>
                <button type="reset" class="btn-secondary-custom">초기화</button>
                <a href="/community/list" class="btn-secondary-custom">취소</a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById("fileName").addEventListener("change", function () {
    if (this.files[0] && this.files[0].size > 100 * 1024 * 1024) {
        alert("파일 크기는 100MB를 초과할 수 없습니다.");
        this.value = "";
    }
});
document.querySelector("form").addEventListener("submit", function (e) {
    var t = document.getElementById("title").value.trim();
    var c = document.getElementById("category").value;
    var ct = document.getElementById("content").value.trim();
    if (!t || !c || !ct) { alert("제목, 카테고리, 본문을 모두 입력해주세요."); e.preventDefault(); }
});
</script>
</body>
</html>
