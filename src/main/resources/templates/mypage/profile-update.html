<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 수정 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">마이페이지</div>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 내 프로필</a>
        <a href="/my/profile-update" class="active"><i class="bi bi-pencil"></i> 프로필 수정</a>
        <a href="/my/courses"><i class="bi bi-play-btn"></i> 진행 중인 강의</a>
        <a href="/mypay/pay"><i class="bi bi-receipt"></i> 결제 내역</a>
        <a href="/cart/purchase"><i class="bi bi-cart"></i> 장바구니</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">프로필 수정</h1>
        <p class="page-subtitle">회원 정보를 수정하세요</p>

        <div class="card" style="max-width: 560px;">
            <form action="/my/profile-update" method="post" enctype="multipart/form-data">
                <input type="hidden" id="user-id-input" name="id" th:value="${#authentication.principal.id}">

                <div style="text-align:center; margin-bottom:24px;">
                    <img id="profilePreview" src="/images/default-image.jpg" alt="프로필" class="profile-avatar">
                    <div style="margin-top:12px;">
                        <label for="mfilename" class="btn-secondary-custom" style="cursor:pointer;">
                            <i class="bi bi-camera"></i> 사진 변경
                        </label>
                        <input type="file" id="mfilename" name="mfilename" accept="image/*" style="display:none;" onchange="previewImage(this)">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label-custom">이름</label>
                    <input type="text" class="form-input" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">닉네임</label>
                    <input type="text" class="form-input" id="nickname" name="nickname" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">이메일</label>
                    <input type="email" class="form-input" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">연락처</label>
                    <input type="text" class="form-input" id="phone_number" name="phone_number" required>
                </div>

                <div style="display:flex; gap:10px; margin-top:24px;">
                    <button type="submit" class="btn-primary-custom">저장하기</button>
                    <a href="/my/mypage" class="btn-secondary-custom">취소</a>
                </div>
            </form>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('profilePreview').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

document.addEventListener('DOMContentLoaded', function () {
    const userId = document.getElementById('user-id-input').value;
    fetch('/my/getMyInfo?userId=' + userId)
        .then(r => r.json())
        .then(data => {
            document.getElementById('name').value = data.name || '';
            document.getElementById('nickname').value = data.nickname || '';
            document.getElementById('email').value = data.email || '';
            document.getElementById('phone_number').value = data.phone_number || '';
        })
        .catch(() => {});
});
</script>
</body>
</html>
