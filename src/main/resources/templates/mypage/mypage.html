<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">마이페이지</div>
        <a href="/my/mypage" class="active"><i class="bi bi-person-circle"></i> 내 프로필</a>
        <a href="/my/profile-update"><i class="bi bi-pencil"></i> 프로필 수정</a>
        <a href="/my/courses"><i class="bi bi-play-btn"></i> 진행 중인 강의</a>
        <a href="/mypay/pay"><i class="bi bi-receipt"></i> 결제 내역</a>
        <a href="/cart/purchase"><i class="bi bi-cart"></i> 장바구니</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">내 프로필</h1>
        <p class="page-subtitle">회원 정보를 확인하세요</p>

        <div class="card">
            <div class="profile-card">
                <img id="profileImage" src="/images/default-image.jpg" alt="프로필" class="profile-avatar">
                <div class="profile-info">
                    <h3 id="name">로딩 중...</h3>
                    <p><i class="bi bi-person"></i> 닉네임: <span id="nickname">-</span></p>
                    <p><i class="bi bi-envelope"></i> 이메일: <span id="email">-</span></p>
                    <p><i class="bi bi-phone"></i> 연락처: <span id="phone_number">-</span></p>
                    <p><i class="bi bi-calendar"></i> 가입일: <span id="created_at">-</span></p>
                </div>
            </div>
        </div>

        <div style="margin-top: 16px;">
            <a href="/my/profile-update" class="btn-primary-custom">프로필 수정</a>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

<script>
document.addEventListener('DOMContentLoaded', function () {
    const userId = document.getElementById('user-id').value;
    fetch('/my/getMyInfo?userId=' + userId)
        .then(r => r.json())
        .then(data => {
            document.getElementById('name').innerText = data.name || '-';
            document.getElementById('nickname').innerText = data.nickname || '-';
            document.getElementById('email').innerText = data.email || '-';
            document.getElementById('phone_number').innerText = data.phone_number || '-';
            if (data.created_at) {
                document.getElementById('created_at').innerText = new Date(data.created_at).toISOString().split('T')[0];
            }
        })
        .catch(() => {});
});
</script>
</body>
</html>
