<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>유저 관리 페이지</title>
    <!-- Bootstrap CSS 추가 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"> <!-- 이미지 아이콘 부트스트랩 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"> <!-- Google Fonts -->
    <style>
        /* 기본 글꼴 설정 */
        body {
            font-family: 'Roboto', sans-serif;
        }

        /* 왼쪽 사이드바 스타일 */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 114px; /* 상단 네비게이션 바 바로 아래에 위치하도록 수정 */
            left: 0;
            background-color: #2c3e50;
            padding-top: 20px;
            padding-left: 20px;
            padding-right: 20px;
            color: white;
            box-shadow: 4px 0px 10px rgba(0, 0, 0, 0.1);
            z-index: 1; /* 다른 콘텐츠보다 위에 표시되도록 */
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            font-size: 16px;
            padding: 12px 20px;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #f39c12;
        }

        .sidebar .active {
            background-color: #e67e22;
        }



    </style>
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<!-- 왼쪽 사이드바 -->
<!-- 왼쪽 사이드바 -->
<div class="sidebar">
    <a href="/my/mypage" >내 프로필</a>
    <a href="/my/profile-update">내 프로필 수정</a>
    <a href="/my/courses"      >진행 중인 강의</a>
    <a href="#">수료한 강의</a>
    <a href="/cart/purchase">나의 장바구니</a>
    <a href="/mypay/pay"   class="active" >나의 결제내역</a>
</div>


<!-- 숨겨진 input 필드 추가 (Thymeleaf로 로그인한 사용자 ID 전달) -->
<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

</body>
<script>
    document.addEventListener('DOMContentLoaded', async function () {
           // 숨겨진 사용자 ID 가져오기
           const userIdElement = document.getElementById('user-id');
           if (!userIdElement) {
               console.error("user-id 요소를 찾을 수 없습니다. HTML 구조를 확인하세요.");
               return;
           }

           const userId = userIdElement.value;

           try {
               // 사용자 정보를 가져오기 위해 fetch 호출
               const response = await fetch(`/my/page?userId=${userId}`);
               if (!response.ok) {
                   throw new Error('서버 응답이 올바르지 않습니다.');
               }

               // JSON 데이터 파싱
               const data = await response.json();


     } catch (error) {
            console.error('에러 발생:', error);
        }
    });

</script>
</html>
