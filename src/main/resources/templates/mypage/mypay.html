<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 내역 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">마이페이지</div>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 내 프로필</a>
        <a href="/my/profile-update"><i class="bi bi-pencil"></i> 프로필 수정</a>
        <a href="/my/courses"><i class="bi bi-play-btn"></i> 진행 중인 강의</a>
        <a href="/mypay/pay" class="active"><i class="bi bi-receipt"></i> 결제 내역</a>
        <a href="/cart/purchase"><i class="bi bi-cart"></i> 장바구니</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">결제 내역</h1>
        <p class="page-subtitle">나의 결제 내역을 확인하세요</p>

        <div class="card">
            <div class="empty-state">
                <i class="bi bi-receipt-cutoff"></i>
                <p>결제 내역이 없습니다.</p>
            </div>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

<script>
document.addEventListener('DOMContentLoaded', async function () {
    const userId = document.getElementById('user-id').value;
    try {
        const response = await fetch('/my/page?userId=' + userId);
        if (response.ok) {
            const data = await response.json();
        }
    } catch (error) {
        console.error('에러 발생:', error);
    }
});
</script>
</body>
</html>
