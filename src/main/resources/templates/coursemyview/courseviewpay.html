<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 상세 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/homecss/footer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .video-container { position:relative; width:100%; padding-bottom:56.25%; border-radius:12px; overflow:hidden; background:#000; margin-bottom:20px; }
        .video-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
        .course-layout { display:grid; grid-template-columns:3fr 1fr; gap:24px; }
        .curriculum-list { list-style:none; padding:0; }
        .curriculum-list li a { display:flex; align-items:center; gap:10px; padding:12px 16px; color:#333; text-decoration:none; font-size:14px; border-bottom:1px solid #f0f0f0; transition:all .2s; }
        .curriculum-list li a:hover { background:rgba(108,99,255,.05); color:#6c63ff; }
        .curriculum-list li a i { font-size:16px; color:#6c63ff; width:20px; text-align:center; }
        @media (max-width:768px) { .course-layout { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div style="max-width:1100px; margin:0 auto; padding:32px 20px;">
    <a href="/my/courses" class="btn-secondary-custom" style="margin-bottom:20px; display:inline-block;"><i class="bi bi-arrow-left"></i> 목록</a>

    <div class="course-layout">
        <div>
            <div class="card">
                <h1 class="page-title" th:text="${course.title}">강의 제목</h1>
                <p style="color:#888; font-size:14px; margin-bottom:20px;" th:text="${course.summary}">강의 요약</p>
            </div>

            <div class="video-container">
                <iframe th:src="@{${course.url}}" title="YouTube video player" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div class="card">
                <div class="card-header-custom">강의 설명</div>
                <p style="line-height:1.8; font-size:15px; color:#444;" th:text="${course.description}">강의 상세 설명</p>
            </div>
        </div>

        <div>
            <div class="card">
                <div class="card-header-custom">커리큘럼 & 자료</div>
                <ul class="curriculum-list">
                    <li><a href="#"><i class="bi bi-info-circle"></i> 강의 개요</a></li>
                    <li><a th:href="@{/coursefiles/{materials}(materials=${course.materials})}" download><i class="bi bi-download"></i> 강의자료 다운</a></li>
                    <li><a href="#"><i class="bi bi-question-circle"></i> 자주 묻는 질문</a></li>
                    <li><a href="/course/reviews"><i class="bi bi-star"></i> 수강생 리뷰</a></li>
                    <li><a href="#"><i class="bi bi-envelope"></i> 강사 연락처</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div th:insert="fragments/footer :: footer"></div>
</body>
</html>
