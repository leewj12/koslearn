<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진행 중인 강의 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .course-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
        .course-card { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); overflow:hidden; transition:all .2s; }
        .course-card:hover { transform:translateY(-3px); box-shadow:0 6px 20px rgba(0,0,0,.1); }
        .course-card img { width:100%; height:180px; object-fit:cover; }
        .course-card-body { padding:16px; }
        .course-card-body h3 { font-size:15px; font-weight:700; color:#1a1a2e; margin-bottom:6px; }
        .course-card-body p { font-size:13px; color:#888; margin-bottom:12px; }
        .course-card-actions { display:flex; gap:8px; }
        .course-card-actions a { flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; transition:all .2s; }
        .btn-view { background:#6c63ff; color:#fff; }
        .btn-view:hover { background:#5a52d5; }
        .btn-review { background:rgba(108,99,255,.1); color:#6c63ff; }
        .btn-review:hover { background:rgba(108,99,255,.2); }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">학생 메뉴</div>
        <a href="/my/mypage"><i class="bi bi-person-circle"></i> 내 프로필</a>
        <a href="/my/profile-update"><i class="bi bi-pencil-square"></i> 프로필 수정</a>
        <a href="/my/courses" class="active"><i class="bi bi-play-circle"></i> 진행 중인 강의</a>
        <a href="/cart/purchase"><i class="bi bi-cart"></i> 장바구니</a>
        <a href="/mypay/pay"><i class="bi bi-credit-card"></i> 결제내역</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">진행 중인 강의</h1>
        <p class="page-subtitle">환영합니다, <span th:text="${#authentication.name}"></span>님!</p>

        <div id="no-courses-message" class="empty-state">
            <i class="bi bi-play-circle"></i>
            <p>현재 진행 중인 강의가 없습니다.</p>
        </div>

        <div id="courses-list" class="course-grid"></div>

        <input type="hidden" id="user-id" th:value="${#authentication.principal.id}">
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
document.addEventListener('DOMContentLoaded', async function() {
    const userId = document.getElementById('user-id').value;
    try {
        const response = await fetch(`/my/paycourses?userId=${userId}`);
        if (response.ok) {
            const courses = await response.json();
            if (courses.length > 0) {
                const coursesList = document.getElementById('courses-list');
                coursesList.innerHTML = '';
                courses.forEach(course => {
                    coursesList.innerHTML += `
                        <div class="course-card">
                            <img src="/courseimages/${course.image}" alt="강의 이미지">
                            <div class="course-card-body">
                                <h3>${course.title}</h3>
                                <p>${course.nickname}</p>
                                <div class="course-card-actions">
                                    <a href="/course/myview/${course.course_id}" class="btn-view"><i class="bi bi-eye"></i> 강의 보기</a>
                                    <a href="/course/my/review/${course.course_id}" class="btn-review"><i class="bi bi-star-fill"></i> 별점</a>
                                </div>
                            </div>
                        </div>`;
                });
                document.getElementById('no-courses-message').style.display = 'none';
            } else {
                document.getElementById('no-courses-message').style.display = 'block';
            }
        }
    } catch (error) { console.error('에러:', error); }
});
</script>
</body>
</html>
