<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Bootstrap CSS (사용자 편의상 외부 CDN 링크로 추가) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"> <!-- 부트스트랩 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"> <!-- Poppins 폰트 추가 -->

    <style>
        /* 기존 스타일 */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
        }

        .sidebar {
            background-color: #343a40;
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 30px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar a {
            color: #fff;
            font-size: 16px;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #007bff;
        }

        .content {
            margin-left: 270px;
            padding: 30px;
        }

        .dashboard-header {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
            display: flex;
            align-items: center;
        }

        /* 테이블 스타일 개선 */
        .table {
            font-size: 13px; /* 글자 크기 축소 */
            margin-bottom: 30px;
        }

        /* 각 셀의 너비 제한 */
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
            padding: 10px 5px; /* 패딩 조정 */
            border: 1px solid #ddd;
            width: 120px; /* 각 셀의 너비 제한 */
            max-width: 150px; /* 셀 너비 최대 값 설정 */
        }

        .table th {
            background-color: #007bff;
            color: white;
        }

        .table-striped tbody tr:nth-child(odd) {
            background-color: #f2f2f2;
        }

        .table tbody tr:hover {
            background-color: #f1f1f1;
        }

        .table td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 버튼 스타일 개선 */
        .btn-info {
            background-color: #17a2b8;
            border-color: #17a2b8;
        }

        .btn-info:hover {
            background-color: #138496;
            border-color: #117a8b;
        }

        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
        }

        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
    </style>
</head>
<body>

<!-- Sidebar 메뉴 -->
<div class="sidebar">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a href="/home"><i class="bi bi-house-door"></i> 홈</a>
        </li>

        <li class="nav-item">
            <a href="/admin/home"><i class="bi bi-house-door"></i> 관리자 페이지</a>
        </li>

        <li class="nav-item">
            <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        </li>
        <li class="nav-item">
            <a href="/course/view"><i class="bi bi-play-circle"></i> 강의보기</a>
        </li>
        <li class="nav-item">
            <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
        </li>
        <li class="nav-item">
            <a href="/signup" sec:authorize="!isAuthenticated()"><i class="bi bi-person-plus"></i> 회원가입</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_STUDENT') or hasRole('ROLE_ADMIN')">
            <a href="/my/mypage"><i class="bi bi-person-circle"></i> 마이페이지</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_STUDENT') or hasRole('ROLE_ADMIN')">
            <a href="/cart/purchase"><i class="bi bi-cart"></i> 장바구니</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_INSTRUCTOR') or hasRole('ROLE_ADMIN')">
            <a href="/instructor/myinstructor"><i class="bi bi-person-bounding-box"></i> 강사 마이페이지</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성하기</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a href="/admin/users"><i class="bi bi-person-check"></i> 회원 관리</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a href="/logout"><i class="bi bi-box-arrow-right"></i> 로그아웃</a>
        </li>

        <!-- 로그인한 사용자의 아이디와 환영 메시지 -->
        <li sec:authorize="isAuthenticated()">
            <span class="welcome-message" style="color: #ffffff;">환영합니다, <span th:text="${#authentication.name}"></span>님! <i class="bi bi-person-check"></i></span>
        </li>
    </ul>
</div>

<!-- 메인 콘텐츠 -->
<div class="content">
    <div class="dashboard-header">
        <i class="bi bi-journal-bookmark"></i> 코스런 관리자 강의 관리 페이지
    </div>

    <!-- 강의 목록 테이블 -->
    <div class="card">
        <div class="card-header">
            코스런 강의 상세보기
        </div>
        <div class="container">
            <div class="course-detail-container">
                <h2 th:text="${course.title}">Course Title</h2>

                <!-- Thumbnail -->
                <img th:src="@{${course.thumbnailUrl}}" class="thumbnail" alt="Course Thumbnail" />

                <!-- Course Information -->
                <div class="course-info">
                    <p><strong>강의 설명:</strong> <span th:text="${course.description}">Course Description</span></p>
                    <p><strong>카테고리:</strong> <span th:text="${course.category}">Category</span></p>
                    <p><strong>난이도:</strong> <span th:text="${course.level}">Level</span></p>
                    <p><strong>가격:</strong> <span class="price" th:text="${course.price}">Price</span> 원</p>
                    <p><strong>등록일:</strong> <span th:text="${course.createdAtFormatted}">Created At</span></p>
                    <p><strong>간단 설명:</strong> <span th:text="${course.summary}">Summary</span></p>

                    <!-- Materials (Attached files) -->
                    <p><strong>첨부파일:</strong>
                        <span th:text="${course.materials != null ? course.materials : 'No attachments'}">Materials</span>
                    </p>
                </div>

                <!-- Back Button -->
                <div style="margin-top: 20px;">
                    <a href="/admin/course/list" class="btn btn-primary">뒤로 가기</a>
                </div>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 모든 가격 요소에 대해 처리
        var priceElements = document.querySelectorAll('.course-price');

        priceElements.forEach(function(priceElement) {
            // 각 요소의 텍스트 값을 가져와서 콤마 추가
            var price = priceElement.innerText;

            // 가격 값이 숫자로 변환 가능한 경우에만 처리
            var formattedPrice = parseInt(price.replace(/,/g, '')) // 콤마를 제거하고 숫자만 처리
                                    .toLocaleString(); // 3자리마다 콤마 추가

            // 다시 가격 값으로 업데이트
            priceElement.innerText = formattedPrice;
        });
    });
</script>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
