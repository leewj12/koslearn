<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 상세 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div class="layout-sidebar">
    <nav class="sidebar">
        <div class="sidebar-title">관리자 메뉴</div>
        <a href="/admin/home"><i class="bi bi-speedometer2"></i> 대시보드</a>
        <a href="/admin/notice"><i class="bi bi-pencil-square"></i> 공지사항 작성</a>
        <a href="/noticeview"><i class="bi bi-bell"></i> 공지사항</a>
        <a href="/admin/courselist" class="active"><i class="bi bi-play-circle"></i> 강의 관리</a>
        <a href="/admin/payment"><i class="bi bi-credit-card"></i> 결제 관리</a>
        <a href="/admin/users"><i class="bi bi-people"></i> 회원 관리</a>
        <a href="/community/list"><i class="bi bi-chat-left-text"></i> 커뮤니티</a>
    </nav>

    <main class="content-area">
        <h1 class="page-title">강의 상세보기</h1>
        <p class="page-subtitle">강의 정보를 확인하세요</p>

        <div class="card" style="max-width:800px;">
            <h2 style="font-size:1.3rem; font-weight:700; color:#1a1a2e; margin-bottom:16px;" th:text="${course.title}">강의 제목</h2>

            <img th:if="${course.thumbnailUrl != null}" th:src="@{${course.thumbnailUrl}}" alt="썸네일" style="width:100%; border-radius:8px; margin-bottom:20px;">

            <div style="display:flex; flex-direction:column; gap:12px; font-size:14px;">
                <div><strong style="color:#555;">강의 설명:</strong> <span th:text="${course.description}" style="color:#444;"></span></div>
                <div><strong style="color:#555;">카테고리:</strong> <span class="badge-custom badge-purple" th:text="${course.category}"></span></div>
                <div><strong style="color:#555;">난이도:</strong> <span class="badge-custom badge-purple" th:text="${course.level}"></span></div>
                <div><strong style="color:#555;">가격:</strong> <span class="course-price" style="font-size:1.2rem; font-weight:700; color:#6c63ff;" th:text="${course.price}"></span> 원</div>
                <div><strong style="color:#555;">등록일:</strong> <span th:text="${course.createdAtFormatted}" style="color:#444;"></span></div>
                <div><strong style="color:#555;">간단 설명:</strong> <span th:text="${course.summary}" style="color:#444;"></span></div>
                <div><strong style="color:#555;">첨부파일:</strong> <span th:text="${course.materials != null ? course.materials : '없음'}" style="color:#444;"></span></div>
            </div>

            <div style="margin-top:24px;">
                <a href="/admin/courselist" class="btn-secondary-custom"><i class="bi bi-arrow-left"></i> 뒤로 가기</a>
            </div>
        </div>
    </main>
</div>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
    <i class="bi bi-list"></i>
</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('.course-price').forEach(function(el) {
        var price = el.innerText;
        var formatted = parseInt(price.replace(/,/g, '')).toLocaleString();
        el.innerText = formatted;
    });
});
</script>
</body>
</html>
