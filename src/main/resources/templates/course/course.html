<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 상세 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/homecss/footer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .course-layout { display:grid; grid-template-columns:2fr 1fr; gap:24px; }
        .course-image img { width:100%; border-radius:12px; margin-bottom:20px; }
        .badge-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
        .badge-item { display:inline-block; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600; background:rgba(108,99,255,.1); color:#6c63ff; }
        .course-price { font-size:1.8rem; font-weight:800; color:#6c63ff; margin:16px 0; }
        .section-card { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:24px; margin-bottom:20px; }
        .section-card h3 { font-size:1rem; font-weight:700; color:#1a1a2e; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #eee; }
        .instructor-profile { display:flex; gap:16px; align-items:flex-start; }
        .instructor-profile img { width:70px; height:70px; border-radius:50%; object-fit:cover; border:2px solid #6c63ff; }
        .instructor-profile h5 { font-size:15px; font-weight:700; color:#1a1a2e; margin-bottom:4px; }
        .instructor-profile p { font-size:13px; color:#666; margin-bottom:4px; }
        .preview-video iframe { width:100%; height:200px; border-radius:10px; border:none; }
        .review-item { border-bottom:1px solid #f0f0f0; padding:12px 0; }
        .review-item:last-child { border-bottom:none; }
        .star-rating { color:#ffc107; margin-right:8px; }
        .action-btn { display:block; width:100%; padding:14px; border-radius:10px; font-size:15px; font-weight:600; text-align:center; text-decoration:none; cursor:pointer; transition:all .2s; margin-bottom:10px; border:none; }
        .btn-cart { background:#6c63ff; color:#fff; }
        .btn-cart:hover { background:#5a52d5; color:#fff; }
        .btn-enroll { background:rgba(108,99,255,.1); color:#6c63ff; }
        .btn-enroll:hover { background:rgba(108,99,255,.2); }
        @media (max-width:768px) { .course-layout { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div style="max-width:1100px; margin:0 auto; padding:32px 20px;">
    <div class="course-layout">
        <div>
            <div class="section-card">
                <h1 class="page-title" th:text="${course.title}">강의 제목</h1>
                <hr style="border:none; border-top:1px solid #eee; margin:16px 0;">
                <p style="font-size:15px; color:#555; line-height:1.7;" th:text="${course.summary}">강의 요약</p>
            </div>

            <div class="course-image">
                <img th:src="@{'/courseimages/' + ${course.image}}" alt="강의 이미지">
            </div>

            <div class="section-card" id="overview">
                <h3>강의 설명</h3>
                <p style="line-height:1.8; font-size:15px; color:#444;" th:text="${course.description}">강의 상세 설명</p>
            </div>

            <div class="section-card" id="reviews">
                <h3>강의 리뷰</h3>
                <div class="review-item">
                    <span class="star-rating">★★★★★</span>
                    <strong>리뷰 제목 1</strong>
                    <p style="font-size:14px; color:#555; margin:6px 0;">여기에 리뷰 내용을 입력하세요.</p>
                    <small style="color:#999;">작성자: 사용자1 | 날짜: 2024-11-24</small>
                </div>
                <div class="review-item">
                    <span class="star-rating">★★★★☆</span>
                    <strong>리뷰 제목 2</strong>
                    <p style="font-size:14px; color:#555; margin:6px 0;">또 다른 리뷰 내용을 작성하세요.</p>
                    <small style="color:#999;">작성자: 사용자2 | 날짜: 2024-11-23</small>
                </div>
            </div>

            <div class="section-card" id="board">
                <h3>강의 게시판</h3>
                <p style="font-size:14px; color:#555; margin-bottom:12px;">강의와 관련된 질문이나 토론을 나눌 수 있는 게시판입니다.</p>
                <a href="#" class="btn-primary-custom"><i class="bi bi-pencil-square"></i> 게시글 작성하기</a>
            </div>
        </div>

        <div>
            <div class="section-card" style="text-align:center;">
                <div class="badge-row" style="justify-content:center;">
                    <span class="badge-item" th:text="'카테고리: ' + ${course.category}">카테고리</span>
                    <span class="badge-item" th:text="'난이도: ' + ${course.level}">난이도</span>
                </div>
                <p style="font-size:13px; color:#888;"><strong>등록일:</strong> <span th:text="${course.getCreatedAtFormatted()}">등록일</span></p>
                <div class="course-price" th:text="'₩' + ${course.price}">₩49,000</div>
            </div>

            <div class="section-card">
                <h3>강의 미리보기</h3>
                <div class="preview-video">
                    <iframe th:src="@{${course.thumbnail}}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>

            <div class="section-card" id="instructor">
                <h3>강사 프로필</h3>
                <div class="instructor-profile">
                    <img th:src="@{'/Instructorimages/' + ${course.hashing_filename}}" alt="강사 프로필">
                    <div>
                        <h5 th:text="${course.instructorName}">강사 이름</h5>
                        <p th:text="${course.biography}">경력</p>
                        <p th:text="${course.introduction}">소개</p>
                        <p th:text="${course.greeting}">인사말</p>
                    </div>
                </div>
            </div>

            <a href="#" class="action-btn btn-cart"><i class="bi bi-cart-plus"></i> 장바구니에 추가</a>
            <a href="#" id="purchaseButton" class="action-btn btn-enroll"><i class="bi bi-mortarboard"></i> 강의 수강신청하기</a>
        </div>
    </div>
</div>

<input type="hidden" id="user-id"
       th:value="${#authentication != null ? (#authentication.principal instanceof T(com.kosmo.security.CustomUserDetails) ? #authentication.principal.id : 'guest') : 'guest'}" />

<div th:insert="fragments/footer :: footer"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentUrl = window.location.href;
    const lectureName = decodeURIComponent(currentUrl.split('/').pop());
    const purchaseButton = document.getElementById('purchaseButton');
    purchaseButton.href = `/cart/purchase?lectureName=${lectureName}`;
    const userId = document.getElementById('user-id').value;

    purchaseButton.addEventListener('click', function(event) {
        if (userId === 'guest') {
            event.preventDefault();
            alert("로그인이 필요한 서비스입니다. 로그인 후 다시 시도해 주세요.");
            window.location.href = '/login';
        } else {
            event.preventDefault();
            fetch('/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, lectureName: lectureName })
            })
            .then(response => response.json())
            .then(responseData => {
                const message = responseData.message;
                if (message.includes('이미')) {
                    alert(message);
                    window.location.href = '/cart/purchase';
                } else {
                    alert('강의가 장바구니에 추가되었습니다.');
                    window.location.href = '/cart/purchase';
                }
            })
            .catch(error => { alert('오류가 발생했습니다. 다시 시도해 주세요.'); console.error('Error:', error); });
        }
    });

    document.querySelectorAll('.course-price').forEach(function(el) {
        var text = el.innerText.replace('₩', '').trim();
        var formatted = parseInt(text.replace(/,/g, '')).toLocaleString();
        el.innerText = '₩' + formatted;
    });
});
</script>
</body>
</html>
