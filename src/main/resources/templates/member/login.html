<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코스런 로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .gradient-custom {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            max-width: 440px;
            width: 100%;
            padding: 44px 36px 36px;
        }

        .card h2 {
            color: #1a1a2e;
            font-weight: 800;
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .card .mb-4 {
            color: #888;
            font-size: 14px;
        }

        .card label {
            color: #444;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }

        .form-control {
            background: #fafafa;
            border: 1.5px solid #e0e0e0;
            color: #333;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            transition: border-color .2s;
        }

        .form-control:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108,99,255,.1);
            background: #fff;
        }

        .btn-primary {
            background: #6c63ff;
            border: none;
            font-size: 15px;
            padding: 13px;
            font-weight: 700;
            border-radius: 10px;
            transition: background .2s;
        }
        .btn-primary:hover { background: #5a52d5; }

        .card a {
            color: #6c63ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .card a:hover { text-decoration: underline; }

        .btn-spacing { margin-top: 10px; margin-bottom: 10px; }

        .form-group { margin-bottom: 1.25rem; }

        .btn-home {
            font-size: 14px;
            padding: 10px 20px;
            background: transparent;
            color: #888;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            transition: all .2s;
            margin-top: 16px;
        }
        .btn-home:hover {
            border-color: #6c63ff;
            color: #6c63ff;
            background: transparent;
        }

/* 아이디, 비밀번호 찾기, 회원가입하기 링크를 한 줄로 표시 */
        .d-inline-flex {
            display: flex;
            justify-content: space-between;
            width: 100%;
            flex-wrap: nowrap;
        }

        .d-inline-flex {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .d-inline-flex a { margin: 0; font-weight: 500; }
        .d-inline-flex .mx-2 { color: #ccc; }

        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .card h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body class="gradient-custom">
<section>
    <div class="container-fluid row justify-content-center align-content-center">
        <div class="card">
            <div class="card-body text-center">
                <h2>코스런 로그인</h2>
                <p class="mb-4">코스런 서비스를<br>이용하려면 로그인이 필요합니다.</p>

                <form id="loginForm" action="/login" method="POST">
                    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
                    <div class="form-group">
                        <label for="username">코스런 아이디</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="password">코스런 비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                    </div>

                    <div class="form-group text-danger">
                        <!-- 로그인 실패 메시지 -->
                        <p th:if="${param.error}" class="text-danger">아이디나 비밀번호가 일치하지 않습니다.</p>
                    </div>


                    <button type="submit" class="btn btn-primary btn-spacing w-100" id="loginButton">로그인</button>
                </form>

                <!-- 아이디 찾기, 비밀번호 찾기, 회원가입하기 링크 -->
                <div class="d-inline-flex mb-4">
                    <a href="/find-id">아이디 찾기</a>
                    <span class="mx-2">|</span>
                    <a href="/findpassword">비밀번호 찾기</a>
                    <span class="mx-2">|</span>
                    <a href="/signup">회원가입하기</a>
                </div>

<button type="button" class="btn btn-home btn-spacing" onclick="location.href='/'">홈으로 돌아가기</button>
            </div>
        </div>
    </div>
</section>

<script>
    $(document).ready(function () {
        $('#loginForm').on('submit', function (e) {
            const username = $('#username').val().trim();
            const password = $('#password').val().trim();

            if (username === '') {
                e.preventDefault();
                alert('아이디를 입력해주세요.');
                $('#username').focus();
                return;
            }
            if (password === '') {
                e.preventDefault();
                alert('비밀번호를 입력해주세요.');
                $('#password').focus();
                return;
            }
        });
    });
</script>
</body>
</html>
