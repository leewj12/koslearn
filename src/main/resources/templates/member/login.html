<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코스런 로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* 전체 배경 */
        .gradient-custom {
            background: linear-gradient(120deg, #6fc3df 25%, #a2d5ab 75%);
            background-size: 200% 200%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: gradient-flow 6s infinite alternate;
        }

        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* 카드 스타일 */
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            height: auto;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        /* 텍스트 */
        .card h2 {
            color: #2b5a80;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .card label {
            color: #4a4a4a;
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            color: #333;
            border-radius: 8px;
            padding: 1rem; /* 아이디, 비밀번호 입력 필드 크기 늘리기 */
        }

        .form-control:focus {
            border-color: #6fc3df;
            box-shadow: 0 0 5px rgba(111, 195, 223, 0.5);
        }

        /* 버튼 */
        .btn-primary {
            background-color: #6fc3df;
            border: none;
            font-size: 0.875rem; /* 로그인 버튼 크기 줄이기 */
            padding: 0.75rem; /* 패딩 줄이기 */
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #5ab4c4;
        }

        /* 링크 */
        .card a {
            color: #2b5a80;
            text-decoration: none;
            font-size: 1rem;
            margin: 0 1rem;
        }

        .card a:hover {
            text-decoration: underline;
        }

        /* 버튼 여백 */
        .btn-spacing {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        /* 폼 레이아웃 */
        .form-group {
            margin-bottom: 1.5rem;
        }

        /* 링크 간격 */
        .d-flex a {
            margin-right: 10px; /* 아이디 찾기, 비밀번호 찾기 간격 좁힘 */
        }

        /* 홈버튼 크기 */
        .btn-home {
            font-size: 0.875rem; /* 홈으로 돌아가기 버튼 크기 줄임 */
            padding: 0.75rem 1rem;
            background-color: #ff6f61;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin-top: 20px; /* 홈 버튼 위치를 살짝 내리기 */
        }

        .btn-home:hover {
            background-color: #ff4c36; /* 홈 버튼 호버 효과 */
        }

/* 아이디, 비밀번호 찾기, 회원가입하기 링크를 한 줄로 표시 */
        .d-inline-flex {
            display: flex;
            justify-content: space-between;
            width: 100%;
            flex-wrap: nowrap;
        }

        .d-inline-flex a {
            margin-right: 10px;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
                margin: 0 10px;
            }

            .card h2 {
                font-size: 1.3rem;
            }

            .d-inline-flex a {
                font-size: 0.85rem;
                margin-right: 5px;
            }
        }
    </style>
</head>
<body class="gradient-custom">
<section>
    <div class="container-fluid row justify-content-center align-content-center">
        <div class="card">
            <div class="card-body text-center">
                <h2>코스런 로그인</h2>
                <p class="mb-4">코스런 서비스를<br>이용하려면 로그인이 필요합니다.</p>

                <form id="loginForm" action="/login" method="POST">
                    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
                    <div class="form-group">
                        <label for="username">코스런 아이디</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="password">코스런 비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                    </div>

                    <div class="form-group text-danger">
                        <!-- 로그인 실패 메시지 -->
                        <p th:if="${param.error}" class="text-danger">아이디나 비밀번호가 일치하지 않습니다.</p>
                    </div>


                    <button type="button" class="btn btn-primary btn-spacing w-100" id="loginButton">로그인</button>
                </form>

                <!-- 아이디 찾기, 비밀번호 찾기, 회원가입하기 링크 -->
                <div class="d-inline-flex mb-4">
                    <a href="/find-id">아이디 찾기</a>
                    <span class="mx-2">|</span>
                    <a href="/findpassword">비밀번호 찾기</a>
                    <span class="mx-2">|</span>
                    <a href="/signup">회원가입하기</a>
                </div>

<button type="button" class="btn btn-home btn-spacing" onclick="location.href='/'">홈으로 돌아가기</button>
            </div>
        </div>
    </div>
</section>

<script>
    $(document).ready(function () {
        $('#loginButton').on('click', function () {
            const username = $('#username').val().trim();
            const password = $('#password').val().trim();

            if (username === '') {
                alert('아이디를 입력해주세요.');
                $('#username').focus();
                return;
            }
            if (password === '') {
                alert('비밀번호를 입력해주세요.');
                $('#password').focus();
                return;
            }
            $('#loginForm').submit();
        });

        // 폼 필드에 포커스 시, 스타일 변경
        $('.form-control').on('focus', function () {
            $(this).css('box-shadow', '0 0 5px rgba(111, 195, 223, 0.5)');
        }).on('blur', function () {
            $(this).css('box-shadow', 'none');
        });

        // 로그인 버튼 호버 시 효과
        $('#loginButton').hover(
            function () {
                $(this).css('background-color', '#5ab4c4');
            },
            function () {
                $(this).css('background-color', '#6fc3df');
            }
        );
    });
</script>
</body>
</html>
