<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header text-center">
                    <h4>코스런 비밀번호 변경</h4>
                </div>
                <div class="card-body">
                    <!-- 에러 메시지 표시 -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        비밀번호 변경에 실패했습니다. 다시 시도해주세요.
                    </div>

                    <!-- 비밀번호 변경 폼 -->
                    <form action="/findpassword/change-password" method="post">
                        <!-- 사용자 이름 -->
                        <div class="mb-3">
                            <label for="username" class="form-label">아이디</label>
                            <input type="text" class="form-control" id="username" name="username" th:value="${username}" readonly>
                        </div>

                        <!-- 새 비밀번호 입력 -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">새 비밀번호</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="새 비밀번호를 입력하세요" required>
                        </div>

                        <!-- 새 비밀번호 확인 -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-success">비밀번호 변경</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    // 비밀번호 확인 로직
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const form = document.querySelector('form');

    form.addEventListener('submit', (e) => {
        if (newPassword.value !== confirmPassword.value) {
            e.preventDefault();
            alert('비밀번호가 일치하지 않습니다.');
        }
    });
</script>
</body>
</html>
