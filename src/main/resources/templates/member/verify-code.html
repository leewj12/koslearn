<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증번호 확인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header text-center">
                    <h4>코스런 이메일 인증번호 확인</h4>
                </div>
                <div class="card-body">
                    <form action="/findpassword/verify-code" method="post">
                        <!-- 사용자 이름 -->
                        <div class="mb-3">
                            <label for="username" class="form-label">아이디</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required>
                        </div>

                        <!-- 인증번호 입력 -->
                        <div class="mb-3">
                            <label for="verificationCode" class="form-label">인증번호</label>
                            <input type="password" class="form-control" id="verificationCode" name="verificationCode" placeholder="인증번호를 입력하세요" required>
                        </div>

                        <!-- 제출 버튼 -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">확인</button>
                        </div>
                    </form>

                    <!-- 오류 메시지 -->
                    <div class="mt-3">
                        <div class="alert alert-danger d-none" id="errorMessage">
                            인증번호가 올바르지 않습니다. 다시 시도해주세요.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    // 오류 메시지 처리
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
        document.getElementById('errorMessage').classList.remove('d-none');
    }
</script>
</body>
</html>
