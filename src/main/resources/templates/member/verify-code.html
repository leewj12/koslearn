<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증번호 확인 - 코스런</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:-apple-system,'Segoe UI',sans-serif; background:#f5f5f9; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .auth-card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:40px; width:100%; max-width:440px; }
        .auth-card h2 { text-align:center; font-size:1.4rem; font-weight:800; color:#1a1a2e; margin-bottom:8px; }
        .auth-card .subtitle { text-align:center; color:#888; font-size:13px; margin-bottom:28px; }
        .form-group { margin-bottom:16px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px; }
        .form-control { width:100%; padding:11px 14px; background:#fafafa; border:1.5px solid #e0e0e0; border-radius:8px; font-size:14px; color:#333; transition:border-color .2s; }
        .form-control:focus { outline:none; border-color:#6c63ff; box-shadow:0 0 0 3px rgba(108,99,255,.1); background:#fff; }
        .btn-submit { width:100%; padding:12px; background:#6c63ff; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s; margin-top:8px; }
        .btn-submit:hover { background:#5a52d5; }
        .alert-error { background:rgba(255,71,87,.06); border:1.5px solid rgba(255,71,87,.2); border-radius:8px; padding:12px; color:#ff4757; font-size:13px; font-weight:500; margin-bottom:16px; text-align:center; }
    </style>
</head>
<body>
<div class="auth-card">
    <h2>이메일 인증번호 확인</h2>
    <p class="subtitle">이메일로 발송된 인증번호를 입력해주세요</p>

    <div class="alert-error" id="errorMessage" style="display:none;">
        인증번호가 올바르지 않습니다. 다시 시도해주세요.
    </div>

    <form action="/findpassword/verify-code" method="post">
        <div class="form-group">
            <label class="form-label" for="username">아이디</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="verificationCode">인증번호</label>
            <input type="password" class="form-control" id="verificationCode" name="verificationCode" placeholder="인증번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn-submit">확인</button>
    </form>
</div>

<script>
if (new URLSearchParams(window.location.search).has('error')) {
    document.getElementById('errorMessage').style.display = 'block';
}
</script>
</body>
</html>
