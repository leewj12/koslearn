<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 결과</title>
    <style>
        /* 전체 레이아웃 설정 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 컨테이너 스타일 */
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 60px 50px; /* padding 크기 키움 */
            width: 100%;
            max-width: 600px; /* 컨테이너 넓이 키움 */
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 32px; /* 제목 크기 키움 */
            font-weight: 600;
            margin-bottom: 20px; /* 제목과 내용 사이 여백 */
        }

        /* 결과 메시지 스타일 */
        #resultMessage {
            background-color: #e0ffe0;
            border: 1px solid #90e090;
            padding: 30px; /* padding 크기 키움 */
            border-radius: 8px;
            text-align: center;
            font-size: 20px; /* 글자 크기 키움 */
        }

        #resultMessage strong {
            color: #4CAF50;
            font-size: 24px; /* 아이디 크기 키움 */
        }

        /* 에러 메시지 스타일 */
        #errorMessage {
            background-color: #ffe0e0;
            border: 1px solid #e09090;
            padding: 30px; /* padding 크기 키움 */
            border-radius: 8px;
            text-align: center;
            font-size: 20px; /* 글자 크기 키움 */
        }

        /* 에러 메시지의 p만 볼드체로 변경 */
        #errorMessage p {
            color: red;
            font-weight: bold;
        }

        /* 버튼 스타일 */
        .btn {
            display: inline-block;
            margin-top: 30px; /* 버튼 간격 늘리기 */
            padding: 15px 30px; /* 버튼 크기 키움 */
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            text-align: center;
            transition: background-color 0.3s ease;
            font-size: 18px; /* 버튼 글자 크기 키움 */
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* 버튼 그룹 간의 간격 조정 */
        .button-group {
            margin-top: 35px; /* 버튼 그룹 간격 키움 */
            text-align: center;
        }

        .button-group a {
            margin: 0 20px; /* 버튼 간격 늘리기 */
        }
    </style>
</head>
<body>
<div class="container">
    <h2>아이디 찾기 결과</h2>

    <!-- 결과 메시지 -->
    <div id="resultMessage" th:if="${username != null}">
        <p>당신의 아이디는: <strong th:text="${username}"></strong> 입니다.</p>
        <div class="button-group">
            <a href="/login" class="btn">로그인 페이지로 가기</a>
            <a href="/findpassword" class="btn">비밀번호 찾기</a>
        </div>
    </div>

    <!-- 에러 메시지 -->
    <div id="errorMessage" th:if="${username == null}">
        <p>조회 결과가 없습니다.</p>
        <div class="button-group">
            <a href="/findpassword" class="btn">다시 시도하기</a>
            <a href="/login" class="btn">로그인 페이지로 가기</a>
        </div>
    </div>

</div>
</body>
</html>
