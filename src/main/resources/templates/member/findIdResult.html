<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기 결과 - 코스런</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:-apple-system,'Segoe UI',sans-serif; background:#f5f5f9; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .result-card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:40px; width:100%; max-width:480px; text-align:center; }
        .result-card h2 { font-size:1.4rem; font-weight:800; color:#1a1a2e; margin-bottom:24px; }
        .success-box { background:rgba(108,99,255,.06); border:1.5px solid rgba(108,99,255,.2); border-radius:12px; padding:24px; margin-bottom:24px; }
        .success-box p { font-size:15px; color:#555; }
        .success-box strong { color:#6c63ff; font-size:1.2rem; }
        .error-box { background:rgba(255,71,87,.06); border:1.5px solid rgba(255,71,87,.2); border-radius:12px; padding:24px; margin-bottom:24px; }
        .error-box p { color:#ff4757; font-weight:600; font-size:15px; }
        .btn-group { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .btn { display:inline-block; padding:10px 24px; border-radius:8px; font-size:14px; font-weight:600; text-decoration:none; transition:all .2s; }
        .btn-primary { background:#6c63ff; color:#fff; }
        .btn-primary:hover { background:#5a52d5; }
        .btn-secondary { background:transparent; color:#666; border:1.5px solid #ddd; }
        .btn-secondary:hover { border-color:#6c63ff; color:#6c63ff; }
    </style>
</head>
<body>
<div class="result-card">
    <h2>아이디 찾기 결과</h2>

    <div th:if="${username != null}" class="success-box">
        <p>당신의 아이디는</p>
        <p style="margin:8px 0;"><strong th:text="${username}"></strong></p>
        <p>입니다.</p>
    </div>
    <div th:if="${username != null}" class="btn-group">
        <a href="/login" class="btn btn-primary">로그인</a>
        <a href="/findpassword" class="btn btn-secondary">비밀번호 찾기</a>
    </div>

    <div th:if="${username == null}" class="error-box">
        <p><i class="bi bi-exclamation-triangle"></i> 조회 결과가 없습니다.</p>
    </div>
    <div th:if="${username == null}" class="btn-group">
        <a href="/findpassword" class="btn btn-primary">다시 시도</a>
        <a href="/login" class="btn btn-secondary">로그인</a>
    </div>
</div>
</body>
</html>
