<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>강의 리뷰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/header/header.css}">


    <style>
        .star-rating {
            font-size: 40px;
            color: gray;
            cursor: pointer;
        }

        .star-rating.checked {
            color: gold;
        }

        .star-rating-container {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div th:insert="~{fragments/header :: header}"></div>
<div class="container mt-5">
    <h2>코스런 강의 리뷰</h2>
    <hr>
    <br>
    <!-- 강의 제목 및 정보 표시 -->
    <h4>강의 제목: <span th:text="${courseInfo.title}"></span></h4>
    <br>
    <p><strong>강의 설명:</strong> <span th:text="${courseInfo.description}"></span></p>
    <p><strong>강의 내용:</strong> <span th:text="${courseInfo.summary}"></span></p>
    <p><strong>강사 닉네임:</strong> <span th:text="${courseInfo.nickname}"></span></p>

    <!-- 강의 ID를 히든 필드로 추가 -->
    <form th:action="@{/course/my/review}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="courseId" th:value="${courseInfo.courseId}" /> <!-- 수정된 부분 -->

        <div class="form-group">
            <label for="reviewText">리뷰 내용</label>
            <textarea id="reviewText" name="reviewText" class="form-control" rows="4" placeholder="리뷰를 작성해주세요..." required></textarea>
        </div>

        <!-- 강의 별점 선택 (부트스트랩 아이콘으로 선택) -->
        <div class="form-group">
            <label for="rating">강의 별점</label>
            <div class="star-rating-container">
                <i class="bi bi-star star-rating" data-value="1"></i>
                <i class="bi bi-star star-rating" data-value="2"></i>
                <i class="bi bi-star star-rating" data-value="3"></i>
                <i class="bi bi-star star-rating" data-value="4"></i>
                <i class="bi bi-star star-rating" data-value="5"></i>
            </div>
            <input type="hidden" id="rating" name="rating" value="0" required>
            <input type="hidden" name="userId" th:value="${#authentication.principal.id}" />


        </div>

        <!-- 강사 별점 선택 (부트스트랩 아이콘으로 선택) -->
        <div class="form-group">
            <label for="instructorRating">강사 별점</label>
            <div class="star-rating-container">
                <i class="bi bi-star star-rating" data-value="1"></i>
                <i class="bi bi-star star-rating" data-value="2"></i>
                <i class="bi bi-star star-rating" data-value="3"></i>
                <i class="bi bi-star star-rating" data-value="4"></i>
                <i class="bi bi-star star-rating" data-value="5"></i>
            </div>
            <input type="hidden" id="instructorRating" name="instructorRating" value="0" required>
        </div>

        <button type="submit" class="btn btn-primary">리뷰 작성</button>
        <button type="reset" class="btn btn-danger" id="resetButton">리셋</button>
    </form>


</div>

<script>
    // 별점을 클릭했을 때 선택하는 스크립트
    document.querySelectorAll('.star-rating').forEach(function(star) {
        star.addEventListener('click', function() {
            // 현재 선택된 별점
            let rating = this.getAttribute('data-value');
            let targetInput = this.closest('.form-group').querySelector('input[type="hidden"]');

            // 현재 별점 선택
            targetInput.value = rating;

            // 선택한 별점에 'checked' 클래스 추가 (금색으로 표시)
            let stars = this.closest('.star-rating-container').querySelectorAll('.star-rating');
            stars.forEach(function(s) {
                s.classList.remove('checked');
            });

            // 전체 별을 채우고 비우는 방식으로 구현
            for (let i = 0; i < rating; i++) {
                stars[i].classList.add('checked');
            }
        });
    });
</script>

</body>
</html>
