<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 리뷰 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/homecss/footer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .star-rating { font-size:32px; color:#ddd; cursor:pointer; transition:color .2s; }
        .star-rating.checked { color:#ffc107; }
        .star-rating-container { display:flex; gap:6px; margin-bottom:8px; }
        .review-info { font-size:14px; color:#555; margin-bottom:8px; }
        .review-info strong { color:#1a1a2e; }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header"></div>

<div style="max-width:720px; margin:0 auto; padding:32px 20px;">
    <a href="/my/courses" class="btn-secondary-custom" style="margin-bottom:20px; display:inline-block;"><i class="bi bi-arrow-left"></i> 돌아가기</a>

    <h1 class="page-title">강의 리뷰 작성</h1>
    <p class="page-subtitle">수강한 강의에 대한 리뷰를 남겨주세요</p>

    <div class="card" style="margin-bottom:20px;">
        <div class="card-header-custom">강의 정보</div>
        <div class="review-info"><strong>강의 제목:</strong> <span th:text="${courseInfo.title}"></span></div>
        <div class="review-info"><strong>강의 설명:</strong> <span th:text="${courseInfo.description}"></span></div>
        <div class="review-info"><strong>강의 내용:</strong> <span th:text="${courseInfo.summary}"></span></div>
        <div class="review-info"><strong>강사:</strong> <span th:text="${courseInfo.nickname}"></span></div>
    </div>

    <div class="card">
        <form th:action="@{/course/my/review}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="courseId" th:value="${courseInfo.courseId}">
            <input type="hidden" name="userId" th:value="${#authentication.principal.id}">

            <div class="form-group">
                <label class="form-label-custom">리뷰 내용</label>
                <textarea id="reviewText" name="reviewText" class="form-input" rows="4" placeholder="리뷰를 작성해주세요..." required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label-custom">강의 별점</label>
                <div class="star-rating-container" data-target="rating">
                    <i class="bi bi-star star-rating" data-value="1"></i>
                    <i class="bi bi-star star-rating" data-value="2"></i>
                    <i class="bi bi-star star-rating" data-value="3"></i>
                    <i class="bi bi-star star-rating" data-value="4"></i>
                    <i class="bi bi-star star-rating" data-value="5"></i>
                </div>
                <input type="hidden" id="rating" name="rating" value="0" required>
            </div>

            <div class="form-group">
                <label class="form-label-custom">강사 별점</label>
                <div class="star-rating-container" data-target="instructorRating">
                    <i class="bi bi-star star-rating" data-value="1"></i>
                    <i class="bi bi-star star-rating" data-value="2"></i>
                    <i class="bi bi-star star-rating" data-value="3"></i>
                    <i class="bi bi-star star-rating" data-value="4"></i>
                    <i class="bi bi-star star-rating" data-value="5"></i>
                </div>
                <input type="hidden" id="instructorRating" name="instructorRating" value="0" required>
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button type="submit" class="btn-primary-custom">리뷰 작성</button>
                <button type="reset" class="btn-danger-custom" id="resetButton">리셋</button>
            </div>
        </form>
    </div>
</div>

<div th:insert="fragments/footer :: footer"></div>

<script>
document.querySelectorAll('.star-rating').forEach(function(star) {
    star.addEventListener('click', function() {
        var rating = this.getAttribute('data-value');
        var container = this.closest('.star-rating-container');
        var targetId = container.getAttribute('data-target');
        document.getElementById(targetId).value = rating;
        var stars = container.querySelectorAll('.star-rating');
        stars.forEach(function(s) { s.classList.remove('checked'); });
        for (var i = 0; i < rating; i++) { stars[i].classList.add('checked'); }
    });
});
</script>
</body>
</html>
