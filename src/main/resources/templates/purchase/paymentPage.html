<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 페이지 - 코스런</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:-apple-system,'Segoe UI',sans-serif; background:#f5f5f9; color:#333; line-height:1.6; padding:20px; }
        .pay-container { max-width:700px; margin:0 auto; }
        .pay-card { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); padding:24px; margin-bottom:20px; }
        .pay-title { font-size:1.5rem; font-weight:800; color:#1a1a2e; text-align:center; margin-bottom:24px; }
        .section-title { font-size:1rem; font-weight:700; color:#1a1a2e; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #eee; }
        .info-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
        .info-row .label { color:#888; }
        .info-row .value { color:#333; font-weight:500; }
        .pay-table { width:100%; border-collapse:collapse; font-size:14px; }
        .pay-table th { background:#f5f5f9; padding:10px 14px; text-align:left; font-weight:600; color:#555; border-bottom:2px solid #e8e8e8; }
        .pay-table td { padding:10px 14px; border-bottom:1px solid #f0f0f0; color:#444; }
        .form-group { margin-bottom:16px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px; }
        .form-control { width:100%; padding:11px 14px; background:#fafafa; border:1.5px solid #e0e0e0; border-radius:8px; font-size:14px; color:#333; transition:border-color .2s; }
        .form-control:focus { outline:none; border-color:#6c63ff; box-shadow:0 0 0 3px rgba(108,99,255,.1); background:#fff; }
        .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .total-amount { font-size:1.5rem; font-weight:800; color:#6c63ff; text-align:center; padding:16px 0; }
        .btn-group { display:flex; gap:12px; margin-top:16px; }
        .btn-pay { flex:1; padding:14px; background:#6c63ff; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s; }
        .btn-pay:hover { background:#5a52d5; }
        .btn-cancel { flex:1; padding:14px; background:#ff4757; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s; }
        .btn-cancel:hover { background:#e8384f; }
    </style>
</head>
<body>
<div class="pay-container">
    <h1 class="pay-title"><i class="bi bi-credit-card"></i> 결제 정보</h1>

    <div class="pay-card">
        <div class="section-title">구매자 정보</div>
        <div class="info-row"><span class="label">이름</span><span class="value" th:text="${purchaseInfoList[0].name}"></span></div>
        <div class="info-row"><span class="label">이메일</span><span class="value" th:text="${purchaseInfoList[0].email}"></span></div>
        <div class="info-row"><span class="label">연락처</span><span class="value" th:text="${purchaseInfoList[0].phone_number}"></span></div>
    </div>

    <div class="pay-card">
        <div class="section-title">장바구니 내용</div>
        <table class="pay-table">
            <thead><tr><th>강의 제목</th><th>가격</th><th>강사</th></tr></thead>
            <tbody>
            <tr th:each="item : ${purchaseInfoList}">
                <td th:text="${item.title}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.nickname}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pay-card">
        <div class="section-title">결제 방법</div>
        <form id="paymentForm" action="/payment/submit" method="POST">
            <div th:each="item : ${purchaseInfoList}">
                <input type="hidden" name="cartIds" th:value="${item.cartId}">
                <input type="hidden" name="userId" th:value="${item.userId}">
                <input type="hidden" name="courseIds" th:value="${item.courseId}">
                <input type="hidden" id="totalAmountHidden" name="amounts" th:value="${item.price}">
            </div>

            <div class="form-group">
                <label class="form-label" for="cardNumber">카드 번호</label>
                <input type="text" class="form-control" id="cardNumber" name="cardNumber" required placeholder="카드 번호 입력">
            </div>
            <div class="row-2">
                <div class="form-group">
                    <label class="form-label" for="expiryDate">유효 기간</label>
                    <input type="text" class="form-control" id="expiryDate" name="expiryDate" required placeholder="MM/YY">
                </div>
                <div class="form-group">
                    <label class="form-label" for="cvc">CVC</label>
                    <input type="text" class="form-control" id="cvc" name="cvc" required placeholder="CVC">
                </div>
            </div>

            <div style="text-align:center; margin:16px 0 8px;">
                <span style="font-size:13px; color:#888;">총 결제 금액</span>
                <div class="total-amount" id="totalAmount">0 원</div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-pay"><i class="bi bi-check-circle"></i> 결제 진행</button>
                <button type="button" class="btn-cancel" onclick="cancelPayment()"><i class="bi bi-x-circle"></i> 결제 취소</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
const purchaseInfoList = /*[[${purchaseInfoList}]]*/ [];
let totalAmount = 0;
purchaseInfoList.forEach(item => { totalAmount += parseFloat(item.price); });
document.getElementById('totalAmount').innerText = totalAmount.toLocaleString() + ' 원';

function cancelPayment() {
    if (confirm("결제를 취소하시겠습니까? 취소 후에는 이전 화면으로 돌아갑니다.")) {
        window.close();
    }
}
</script>
</body>
</html>
