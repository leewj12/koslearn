<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 - 코스런</title>
    <link rel="stylesheet" th:href="@{/css/header/header.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/homecss/footer.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cart-table { width:100%; border-collapse:collapse; font-size:14px; }
        .cart-table th { background:#f5f5f9; padding:12px 16px; text-align:left; font-weight:600; color:#555; border-bottom:2px solid #e8e8e8; }
        .cart-table td { padding:12px 16px; border-bottom:1px solid #f0f0f0; color:#444; vertical-align:middle; }
        .cart-table tr:hover td { background:#fafafe; }
        .cart-table td img { width:80px; height:50px; object-fit:cover; border-radius:6px; }
        .cart-table input[type="checkbox"] { width:18px; height:18px; accent-color:#6c63ff; }
        .total-bar { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); margin-top:20px; }
        .total-price { font-size:1.5rem; font-weight:800; color:#6c63ff; }
        .buyer-info { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .buyer-info .info-item { font-size:14px; color:#555; }
        .buyer-info .info-item strong { color:#1a1a2e; }
        .modal-content { border-radius:12px; }
        .modal-header { border-bottom:1px solid #eee; }
        #paymentIframe { width:100%; height:500px; border:none; border-radius:8px; }
        @media (max-width:768px) {
            .buyer-info { grid-template-columns:1fr; }
            .total-bar { flex-direction:column; gap:12px; text-align:center; }
            .cart-table { font-size:12px; }
            .cart-table td img { width:60px; height:40px; }
        }
    </style>
</head>
<body>

<div th:insert="fragments/header :: header"></div>

<div style="max-width:1100px; margin:0 auto; padding:32px 20px;">
    <h1 class="page-title"><i class="bi bi-cart3"></i> 장바구니</h1>
    <p class="page-subtitle">수강할 강의를 선택하고 결제를 진행하세요</p>

    <div class="card" style="margin-bottom:20px;">
        <div class="card-header-custom">구매자 정보</div>
        <div class="buyer-info">
            <div class="info-item"><strong>이름:</strong> <span id="userName">로딩 중...</span></div>
            <div class="info-item"><strong>이메일:</strong> <span id="userEmail">로딩 중...</span></div>
            <div class="info-item"><strong>연락처:</strong> <span id="userPhoneNumber">로딩 중...</span></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header-custom">장바구니에 담긴 강의</div>
        <div style="overflow-x:auto;">
            <table class="cart-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll"> 전체</th>
                    <th>이미지</th>
                    <th>강의 제목</th>
                    <th>강의 요약</th>
                    <th>강사</th>
                    <th>가격</th>
                    <th>취소</th>
                </tr>
                </thead>
                <tbody id="courseList"></tbody>
            </table>
        </div>
    </div>

    <div class="total-bar">
        <div>
            <span style="font-size:14px; color:#888;">총 결제 금액</span>
            <div class="total-price"><span id="totalPrice">0</span> 원</div>
        </div>
        <button class="btn-primary-custom" id="paymentButton" style="padding:14px 36px; font-size:16px;"><i class="bi bi-credit-card"></i> 결제하기</button>
    </div>
</div>

<div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="paymentModalLabel">결제 창</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <iframe id="paymentIframe" src="" width="100%" height="500px" frameborder="0"></iframe>
            </div>
        </div>
    </div>
</div>

<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

<div th:insert="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
window.onload = async function() {
    const userId = document.getElementById("user-id").value;
    try {
        const userInfoResponse = await fetch(`/getUserInfo/${userId}`);
        if (userInfoResponse.ok) {
            const userInfo = await userInfoResponse.json();
            document.getElementById("userName").innerText = userInfo.name;
            document.getElementById("userEmail").innerText = userInfo.email;
            document.getElementById("userPhoneNumber").innerText = userInfo.phone_number;
        } else {
            throw new Error("사용자 정보를 불러오는 데 실패했습니다.");
        }

        const cartItemsResponse = await fetch(`/cart/items/${userId}`);
        if (cartItemsResponse.ok) {
            const cartItems = await cartItemsResponse.json();
            const courseList = document.getElementById("courseList");

            cartItems.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="checkbox" class="itemCheckbox" data-id="${item.course_id}" data-price="${item.price}" data-title="${item.title}"></td>
                    <td><img src="/courseimages/${item.image}" alt="강의 이미지"></td>
                    <td>${item.title}</td>
                    <td>${item.summary}</td>
                    <td>${item.instructor_Nickname}</td>
                    <td>${item.price.toLocaleString()}원</td>
                    <td>
                        <input type="hidden" class="courseId" value="${item.course_id}">
                        <button class="btn-danger-custom deleteButton" style="padding:6px 14px; font-size:12px;">삭제</button>
                    </td>
                `;
                courseList.appendChild(row);
            });
            updateTotalPrice();
        } else {
            throw new Error("장바구니 항목을 불러오는 데 실패했습니다.");
        }
    } catch (error) {
        console.error("오류 발생:", error);
        alert(error.message);
    }
};

function updateTotalPrice() {
    let totalPrice = 0;
    document.querySelectorAll('.itemCheckbox:checked').forEach(cb => {
        totalPrice += parseInt(cb.dataset.price);
    });
    document.getElementById("totalPrice").innerText = totalPrice.toLocaleString();
}

document.getElementById("courseList").addEventListener("change", function(event) {
    if (event.target.classList.contains("itemCheckbox")) updateTotalPrice();
});

document.getElementById("selectAll").addEventListener("change", function(event) {
    document.querySelectorAll('.itemCheckbox').forEach(cb => { cb.checked = event.target.checked; });
    updateTotalPrice();
});

document.getElementById("courseList").addEventListener("click", async function(event) {
    if (event.target.classList.contains("deleteButton")) {
        const row = event.target.closest('tr');
        const courseId = row.querySelector('.courseId').value;
        const userId = document.getElementById("user-id").value;
        if (!confirm("정말로 강의 수강신청을 취소하겠습니까?")) return;
        try {
            const response = await fetch(`/cart/remove/${courseId}/${userId}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' } });
            if (response.ok) { row.remove(); updateTotalPrice(); }
            else { alert("항목 삭제에 실패했습니다."); }
        } catch (error) { console.error('삭제 요청 중 오류 발생:', error); alert("항목 삭제에 실패했습니다."); }
    }
});

document.getElementById("paymentButton").addEventListener("click", function() {
    const userId = document.getElementById("user-id").value;
    const selectedItems = [];
    document.querySelectorAll('.itemCheckbox:checked').forEach(cb => {
        selectedItems.push({ id: cb.dataset.id, price: cb.dataset.price, title: cb.dataset.title });
    });
    if (selectedItems.length === 0) { alert("결제할 항목을 선택해주세요."); return; }
    if (!confirm("결제를 진행하시겠습니까?")) return;

    const courseIds = selectedItems.map(item => item.id).join(',');
    const courseTitles = selectedItems.map(item => item.title).join(',');
    const paymentUrl = `/payment/start/${userId}?courseIds=${courseIds}&courseTitles=${courseTitles}`;
    document.getElementById('paymentIframe').src = paymentUrl;
    const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
    paymentModal.show();
});
</script>
</body>
</html>
