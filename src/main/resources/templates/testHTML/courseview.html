<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 목록</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px 0;
            text-align: center;
            border-bottom: 3px solid #388E3C;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .course-card {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .course-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .course-card h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #333;
        }

        .course-card p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }

        .course-card .btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .course-card .btn:hover {
            background-color: #388E3C;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <h1>온라인 강의 목록</h1>
    </div>
</header>

<div class="container">
    <div class="courses">
        <!-- 강의 1 -->
        <div class="course-card">
            <h3>스프링부트 기초</h3>
            <p>스프링부트를 처음 접하는 사람을 위한 기초 강의입니다. 백엔드 개발을 배우고 싶은 분에게 적합합니다.</p>
            <button class="btn" onclick="window.location.href='course-detail.html'">강의 상세보기</button>
        </div>
        <!-- 강의 2 -->
        <div class="course-card">
            <h3>자바 기본 문법</h3>
            <p>자바 언어의 기본 문법을 다루는 강의로, 자바를 처음 시작하는 사람들을 위한 과정입니다.</p>
            <button class="btn" onclick="window.location.href='course-detail.html'">강의 상세보기</button>
        </div>
        <!-- 강의 3 -->
        <div class="course-card">
            <h3>웹 개발의 이해</h3>
            <p>웹 개발을 위한 기본적인 기술들(HTML, CSS, JavaScript)을 배우는 강의입니다.</p>
            <button class="btn" onclick="window.location.href='course-detail.html'">강의 상세보기</button>
        </div>
        <!-- 강의 4 -->
        <div class="course-card">
            <h3>데이터베이스 기초</h3>
            <p>데이터베이스의 기초부터 SQL 쿼리 작성까지 배우는 강의입니다. 데이터베이스 설계를 배우고 싶은 분들에게 적합합니다.</p>
            <button class="btn" onclick="window.location.href='course-detail.html'">강의 상세보기</button>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2024 온라인 강의 플랫폼</p>
</footer>
</body>
</html>
