<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>장바구니</h2>

  <!-- 구매자 정보 (동적으로 업데이트 될 부분) -->
  <div class="mb-4">
    <h4>구매자 정보</h4>
    <p><strong>이름:</strong> <span id="userName">로딩 중...</span></p>
    <p><strong>이메일:</strong> <span id="userEmail">로딩 중...</span></p>
    <p><strong>전화번호:</strong> <span id="userPhone">로딩 중...</span></p>
  </div>

  <!-- 강의 목록 테이블 -->
  <h4>장바구니에 담긴 강의들</h4>
  <table class="table table-bordered">
    <thead>
    <tr>
      <th><input type="checkbox" id="selectAll"> 전체 선택</th>
      <th>강의 제목</th>
      <th>강의 설명</th>
      <th>가격</th>
      <th>삭제</th>
    </tr>
    </thead>
    <tbody id="courseList">
    <tr data-lecture-id="101">
      <td><input type="checkbox" name="selectedCourses" value="101" class="courseCheckbox" data-price="50000"></td>
      <td>스프링 부트</td>
      <td>스프링 부트로 웹 애플리케이션 개발</td>
      <td>₩50,000</td>
      <td><button class="btn btn-danger deleteButton">삭제</button></td>
    </tr>
    <tr data-lecture-id="102">
      <td><input type="checkbox" name="selectedCourses" value="102" class="courseCheckbox" data-price="40000"></td>
      <td>리액트 기초</td>
      <td>리액트를 이용한 프론트엔드 개발</td>
      <td>₩40,000</td>
      <td><button class="btn btn-danger deleteButton">삭제</button></td>
    </tr>
    <tr data-lecture-id="103">
      <td><input type="checkbox" name="selectedCourses" value="103" class="courseCheckbox" data-price="60000"></td>
      <td>자바 마스터</td>
      <td>자바의 기초부터 심화까지</td>
      <td>₩60,000</td>
      <td><button class="btn btn-danger deleteButton">삭제</button></td>
    </tr>
    </tbody>
  </table>

  <!-- 쿠폰 선택 -->
  <h4>쿠폰 선택</h4>
  <div>
    <input type="checkbox" id="coupon1" value="5000" class="couponCheckbox"> ₩5,000 할인 쿠폰
  </div>
  <div>
    <input type="checkbox" id="coupon2" value="10000" class="couponCheckbox"> ₩10,000 할인 쿠폰
  </div>

  <div class="mt-3">
    <h4>총 결제 금액</h4>
    <p id="totalPrice">₩0</p> <!-- 총 결제 금액 표시 -->
  </div>

  <!-- 결제 버튼 -->
  <button class="btn btn-primary mt-3" onclick="alert('구매하기 기능은 나중에 추가됩니다.')">결제하기</button>
</div>

<input type="hidden" id="user-id" th:value="${#authentication.principal.id}">

<script>
  // 페이지가 로드되면 사용자 정보를 AJAX로 요청
  window.onload = async function() {
    const userId = document.getElementById("user-id").value;

    try {
      // 사용자 ID로 서버에서 사용자 정보 가져오기
      const response = await fetch(`/getUserInfo/${userId}`);

      // 응답이 성공적인지 확인
      if (response.ok) {
        const data = await response.json();

        // 응답 받은 데이터로 사용자 정보 업데이트
        document.getElementById("userName").textContent = data.name;
        document.getElementById("userEmail").textContent = data.email;
        document.getElementById("userPhone").textContent = data.phone;
      } else {
        throw new Error("사용자 정보를 불러오는 데 실패했습니다.");
      }
    } catch (error) {
      console.error("사용자 정보 로드 실패:", error);
      alert(error.message);
    }
  };

  // 전체 선택 체크박스 클릭 시 모든 체크박스 상태 변경
  document.getElementById("selectAll").addEventListener("click", function() {
      let checkboxes = document.querySelectorAll(".courseCheckbox");
      checkboxes.forEach(function(checkbox) {
          checkbox.checked = document.getElementById("selectAll").checked;
      });
      updateTotalPrice();
  });

  // 개별 강의 선택 시 가격 계산
  document.querySelectorAll(".courseCheckbox").forEach(function(checkbox) {
      checkbox.addEventListener("change", updateTotalPrice);
  });

  // 쿠폰 선택 시 가격 계산
  document.querySelectorAll(".couponCheckbox").forEach(function(coupon) {
      coupon.addEventListener("change", updateTotalPrice);
  });

  // 총 결제 금액 업데이트
  function updateTotalPrice() {
      let totalPrice = 0;
      // 선택된 강의들의 가격을 합산
      document.querySelectorAll(".courseCheckbox:checked").forEach(function(checkbox) {
          totalPrice += parseInt(checkbox.getAttribute("data-price"));
      });
      // 선택된 쿠폰에 대해 할인 적용
      document.querySelectorAll(".couponCheckbox:checked").forEach(function(coupon) {
          totalPrice -= parseInt(coupon.value);
      });
      // 총 결제 금액 표시
      document.getElementById("totalPrice").textContent = "₩" + totalPrice.toLocaleString();
  }

  // 삭제 버튼 클릭 시 해당 강의 삭제
  document.querySelectorAll(".deleteButton").forEach(function(button) {
      button.addEventListener("click", function() {
          // 강의 ID 가져오기
          var lectureId = this.closest('tr').getAttribute('data-lecture-id');

          // 서버에 강의 삭제 요청 보내기 (Ajax 예시)
          fetch(`/course/cart/remove/${lectureId}`, {
              method: 'DELETE'
          })
          .then(response => {
              if (response.ok) {
                  // 삭제된 항목 제거
                  this.closest('tr').remove();
                  updateTotalPrice();
              } else {
                  alert("삭제 실패");
              }
          });
      });
  });




</script>

</body>
</html>
