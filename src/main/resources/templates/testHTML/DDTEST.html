<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom YouTube Player</title>
  <style href style="st">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .video-container {
      max-width: 100%;
      margin: 50px auto;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 20px;
      position: relative;
    }
    #player {
      width: 100%;
      height: 315px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="video-container">
  <div id="player"></div>
</div>

<script>
  // 1. YouTube API 스크립트 로딩
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  // 2. YouTube Player API 준비
  var player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '315',
      width: '560',
      videoId: 'JEzBDk0E9Rw', // 실제 비디오 ID로 변경
      playerVars: {
        'autoplay': 1,  // 자동 재생
        'controls': 0,  // 기본 플레이어 컨트롤 숨기기
        'showinfo': 0,  // 비디오 정보(제목, 채널 등) 숨기기
        'modestbranding': 1,  // YouTube 로고 최소화
        'rel': 0,  // 비디오 종료 후 관련 비디오 숨기기
        'fs': 0,  // 전체 화면 버튼 숨기기
        'cc_load_policy': 0,  // 자막 숨기기
        'iv_load_policy': 3,  // 비디오 주석 숨기기
        'disablekb': 1,  // 키보드 단축키 비활성화
      }
    });
  }
</script>
</body>
</html>
