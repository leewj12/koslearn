services:
  projects-mysql:
    image: mysql:8.0
    container_name: projects-mysql
    restart: unless-stopped
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: project
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/leewj12/koslearn:latest
    restart: unless-stopped
    ports:
      - "9090:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      projects-mysql:
        condition: service_healthy
    volumes:
      - courseimages:/app/src/main/resources/courseimages
      - coursefiles:/app/src/main/resources/coursefiles
      - instructor_images:/app/src/main/resources/Instructorimages
      - userimages:/app/src/main/resources/userimages
      - notice:/app/src/main/resources/notice
      - communityupload:/app/src/main/resources/communityupload

volumes:
  mysql_data:
  courseimages:
  coursefiles:
  instructor_images:
  userimages:
  notice:
  communityupload:
